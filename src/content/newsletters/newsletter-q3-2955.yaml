  - heading: Confederation Health Services
    kicker: ""
    body: |
      **Director Fallon "Siren" Carter**

      **Short Term Goals**

      I’d like to establish something called an MMU, a Mobile Medical Unit that would convert the cutty red, the apollo and the galaxy into traveling trauma response teams. They would operate in high-traffic or high-risk areas like Jumptown, Orison events or even the Pyro border zones.

      For rp, I think it would be cool to staff CHS medics in zones like Area18, Lorville and Babbage to offer ‘walk-in’ rp services for wound treatments, detox, counseling and implants.

      We could also partner with security orgs for evac and protection. Develop some kind of system using in-game beacons, spectrum coordination or discord bot tools. I’d also like to adopt a tiered alert system like Code Blue, Red, Black, etc. for a more unified response network approach. This would also lend to emphasizing neutrality in conflicts, offering aid to any injured regardless of faction, aligning with real-world Red Cross philosophies - though this might be a no-go given we do not deal with criminal orgs.

      **Long Term Goals**

      I’d definitely like to see a proper hospital and/or med lab built on USC land claim, to develop research on alien pathogens, xeno-biology or cybernetic integrations. I’d like to hopefully have our team be at the forefront of Galactic Medical Tech with regenerative treatments using alien flora/fauna, cybernetic limb reconstruction and long-range med beacons for deep-space rescue. Maybe even establish a medical academy for medical rp further down the road, the “Confederated Institute of Medical Sciences” or CIMS with degrees in Emergency Care, Surgery, Xenomedicine and Ethics.

      I’d also like to see long-haul expeditions deployed to fringe systems affected by Vanduul incursions, or outlaw occupied areas, or even environmental disasters. Delivering aid to refugees or disease-stricken settlements. This could possibly lend to bridging relationships with other factions or orgs, earning protective status through goodwill, or even provide peacekeeping conferences between feuding orgs.
