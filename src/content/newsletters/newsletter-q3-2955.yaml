  - heading: Looking Forward
    kicker: ""
    body: |
      _A Look At Upcoming Events, Missions And Operations For USC Members To Enjoy!_

      Meta Events:

      Events and contests that will roll on an annual schedule of four quarters.

      Each quarter will be hosted by one of the Ministries listed below. They will introduce a theme and post various activities for members to participate in on the USC Discord:

      - Q1 2025 - Security Services Ministry - Operation Pyro
      - Q2 2025 - Interstellar Commerce Ministry - Operation Wikelo Polaris
      - Q3 2025 - Intelligence and Exploration Ministry - Updated Scavenger Hunt Operation for patch 4.2 - Exact Date TBA
      - Q4 2025 - Engineering and Support - Operation TBD

      Each quarter will have activities, events, and/or tasks that fall within the theme and gameplay of Star Citizen. Some events may be in the form of contests, in which members must participate in to earn ‘points’. For contests, all citizens can participate to earn points by participating in group gameplay activities. Points reset every quarter. Each activity may have different ranges of points that can be earned. Refer to the 'Events' channel on the USC Discord for more information.
