  - heading: A Word From The Minister Of Engineering
    kicker: ""
    body: |
      **Zan**

      While we wait for the new Engineering and Crafting game loops to roll into the game we sadly see the need for Medical roles dwindle with some new strategic directions that prefer a quicker return to the action over immersion, teamwork and specializations. I, however have full faith that CIG will keep iterating and find a way to make the game both fun and provide us with a spot for medical focused players on any excursion among the stars.

      Yet our Ministry of Engineering and Support is holding strong with two of the three director positions filled and plenty of need for mined and salvaged resources, particularly for the new Wikelo missions.

      Our main focus therefore should be in organizing ourselves for participating in Navy and Military operations by providing medical and engineering support as well as forging a better collaboration with the Ministry of Interstellar Commerce to get ready for large USC project, like building our very first “Wikelo” Polaris for the Org Fleet.

      Keep an eye on Discord for announcements and calendar events to join.
