  - heading: Tier I Voice Channels
    kicker: "Policy Update: Being Recorded"
    body: |
      The USC is a group content creation organization.

      In Tier I channels, video and audio recording is generally understood to be something members can choose to opt out of since these channels are intended for casual and spontaneous group gameplay. In general, it is good practice (and good manners) for anyone looking to record a session in Tier I channels to please seek permission from others first. A good practice for making newcomers to the group aware of recording is to type "Recording in Progress" in the channel's descriptor.
    gallery: []
  - heading: Tier Ii And Tier Iii Channels
    kicker: ""
    body: |
      As we create a variety of content, it can be great to share video and audio more widely to the general Star Citizen community and to the public, and so recording of audio and visual in our channels can and will happen. Joining any voice channel, especially Tier II and Tier III, is implied consent to recording.
    gallery: []
  - heading: Please Know This
    kicker: ""
    body: |
      We do not police recording. If you have concerns about being recorded, then the USC might not be a good fit for your gameplay preferences, especially if you enjoy speaking about non Star Citizen topics with other participants. We actually view recording as a powerful tool to protect the USC as a whole from bad actors and those that mean to cause harm and create drama.

      Any member submitting a recording to the Cabinet as proof of drama creation, acts of division, harassment, spying or otherwise causing harm to the USC membership as a whole will be protected and their submissions kept private.
