    body: |
      **Director Shaka**

      **Fleet Engineering Update: Q3 Focus**

      **Supporting Shipborne Activities**

      The Fleet Engineer remains dedicated to supporting all shipborne activities for the USC Military and other ministries requiring engineering assistance while awaiting the implementation of engineering and crafting features.

      **Combat Engineer Branch Development**

      Plans are underway to develop a separate branch under the Fleet Engineer umbrella: the Combat Engineer. This branch will focus on:

      - Supporting friendly forces on the ground.
      - Limiting or halting enemy forces on the battlefield.
      - Increasing the survivability odds for friendly forces.

      **Upcoming Events and Training**

      To prepare for the launch of engineering and crafting capabilities, the following events are planned:

      - FPS gameplay events.
      - Crewed ship combat events.
      - Casual science activities to explore current engineering capabilities in Star Citizen.

      **Interdepartmental Integration**

      The Fleet Engineers will continue integrating with other departments and groups during large-scale organizational events to contribute to mission success. These events aim to:

      - Get members used to working together as a unit.
      - Enable Fleet Engineers to operate effectively once engineering and crafting features are live.

      Keep an eye on Discord for announcements and calendar events to join.
