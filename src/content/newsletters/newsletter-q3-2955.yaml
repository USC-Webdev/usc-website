  - heading: "Cargolympics & Navy Petition: Polaris"
    kicker: ""
    body: |
      March: Here are the results of the two Senate topics voted upon. Thanks to all whom have participated!

      Topic 1 - Cargo Olympics:

      **On the subject of when to hold our official "Cargolympics"**

      The vote with 58% went in favor of holding them in July. Organization has already started on what is surely going to be an exciting competition!

      Topic 2 - Navy Petition for Procurement (Collective Goal POC*):

      On the subject of a broader group goal to assist Wikelo the collector so that the USC can acquire a Polaris class corvette.

      An overwhelming 90% have voted in favor.

      The Senate thus refers the matter to the Navy council to begin prepping execution plans. This marks the beginning of our first execution of the USC group goal process. Men and Women of the USC good luck! We salute you!

      **-Chancellor Caylen**

      (*POC = Proof of Concept)
