    body: |
      **Director Wofey**

      Trade—like Star Citizen and like this org—has changed a lot. It’s become what I always hoped it would be: accessible, just like this organization is.

      Here, it doesn’t matter whether you’re just starting out or have been doing this for years. Whether you have a single Aurora to your name or you're busy naming your third Idris, you can find a route—and a place—to call home.

      Like trade itself, this org has been around for years. And like an oak in a storm, it's stood strong—steadfast and reliable—but also willing to adapt with the times.

      I want to thank each and every one of you for making this org a good place to call home. I look forward to developing the Trade Office over the next year or so as new patches roll out and supporting the USC's efforts to create group gameplay. Let's get ready to have some fun!

      Thank you all.
