sections:
  - heading: A Word From The Chancellor
    kicker: ""
    body: |
      Take a few moments to pause... Release yourself into thought and ponder about what the best Organization in the 'verse would be like?

      How would we execute together on that, bring that vision to life, and also more importantly keep it's vision alive in the turmoil of diverging priorities?

      A vision at the mercy of a buggy game that has its own objectives shift, morph and sometimes simply lie still for months and years until suddenly it's features comes into being at sometimes, everyone's exhilaration and at other times, someone's disappointment.

      Would this org look like the USC? Would it be a place that we all cherish, filled with people of like mind, impassioned to live their space lives emboldened with that feeling that you have someone that's got your back no matter what your profession is in the 'verse?

      A place that one's success is the success of all and the success of all is the success of the one.

      Whether that success means building a commercial space empire or just having a great place to hang out with friends.

      Our continuing mission is to keep making the USC that place.

      We've got your back.

      **For Equality, Prosperity, and Freedom**

      **Caylen Vyshir**

      **Chancellor of the Senate**

      United Space Confederation
