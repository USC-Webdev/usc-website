  - heading: Featured Events From 2Q2955
    kicker: ""
    body: |
      A FEW IN-GAME & OUT OF GAME EVENTS OUR MEMBERS CREATED AND PARTICIPATED IN THIS PAST QUARTER

      **CZ Nocturnal Nonsense**

      This mission was hosted by Resident SoviReign and featured PvP shenanigans over at Checkmate.

      The plan was to pick up two red keys run and then run through Checkmate and clear the area for both blue and red paths.

      It was fun Sovi. Thanks!

      **White Blood Cells**

      Hosted by CC1 Creator, well ahead of it's time, the bones for a great mission and opportunity for loads of fun are evident.

      We appreciate you CC1, and like you, can't wait for proper medical gameplay to come out. Thank you!

      **Hunt the Polaris Mission**

      Hosted by Maxwell.

      The Objective:

      Destroy the Frontier Fighters Polaris and it's fleet of escorts.

      The area was heavily contested by other players on the full server.

      Maxwell has hosted several amazing missions this year, and I personally look forward to his New PTU Locations mission launching soon.

      Exploration!

      Hosted by Jicheal Mackson.

      This time, our crew will set out to discover the hidden places in Stanton and see what CIG allowed to persist over the patches.

      On our exploration list are the following locations at the moment (the crew majority has chosen the following for today) :

      Location - Benny Henge,

      Location - Whistlers Crypt,

      **Location - Canyon River on Microtech**

      More Exploration events are coming out soon. Let's Fly!

      PSA: Now that we've completed our refresh updates to the USC Discord, no more testing pings! Please revisit your notifications settings so you don't miss upcoming events.
