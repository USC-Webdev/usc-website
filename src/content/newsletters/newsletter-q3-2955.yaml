  - heading: A Word From The Minister Of State Affairs
    kicker: ""
    body: |
      **Landscaper**

      Thanks for checking out our revamped newsletter.

      The USC has been rebranding for years. Now that it’s finished, we’re ready to move on from strategic planning to implementation.

      Our new website has done a good job of explaining what we are to the Star Citizen community. These newsletters will tell you who we are.

      Interested parties will be able to see insights on how we’re building a great Star Citizen organization.

      With the release of this newsletter, the Ministry of State Affairs will launch initiatives that will showcase our achievements, celebrate our members, and showcase our future ideas.

      One of these initiatives is the start of annual Confederation Conferences with the very first beginning in 3Q2955. Conference Cons will be a formal way for members to socialize, network, hear from and speak with the leadership team, align on collective goals and move forward with operationalizing our goals.

      In addition to our revamped quarterly newsletters, which you're enjoying now, the MSA will begin publishing a 'Message of the Week' post on the USC Discord. The intention of these posts are to update the membership of all the many changes and updates the Leadership Team has implemented during the strategic realignment phase. We are now ready to operationalize the strategic plan and the annual conference, quarterly newsletters and weekly messages will aid in communicating effectively to the membership.

      The MSA will continue to refine the application and onboarding process, with a renewed focus on bring new and old members up to speed on all of the recent updates and new processes and tools we have in place now. We have many openings for Minister and Director positions, and we are actively seeking qualified members to fill them.

      We also plan on re-engaging the SC community through our social media channels.

      Above all, we will continue to support and supply the tools our members need to create group gameplay content!

      We look forward to being your Place.

      Keep an eye on our Discord server for announcements, upcoming events, and ways you can contribute to the USC!
