  - heading: From The Minister Of Security - MSS
    kicker: ""
    body: |
      **Twilly Frost**

      As events in the Persistent Universe heat up, the United Space Confederation and the MSS look to capitalize on the momentum generated from the expanding breadth of content being offered by CIG.

      The security and combat arm of the United Space Confederation has gone through many iterations over the last decade.

      From the very early days of dedicated wings (Omega Wing, represent) to the USCDF, DEFCOM, TRACOM, N-COAT, and many more that died on the vine, the USC has stiven to create a system that can be flexible for not just casual players and mil-sim sweaties, but for the ever-changing landscape of a game in alpha.

      The MSS currently houses two distinct combat types: a civil police force, the Confederation Law Civil Protectorate, and the Citizen Militia, which is further broken down into two separate gameplay elements, FPS (Department of the Marine Corp) and ship combat (Office of Fleet Planning, Director Maxwell Stiles).

      Gameplay elements for law enforcement are not fleshed out as of Q3 2025, so the main focus of the MSS is in providing content for the Citizen Militia.

      Hardcore mission formats and organized high-level strategic operations are housed separately in the USC Navy.

      **So Far This Year…2025**

      **Content Focused**

      This year has been all about creating gameplay content with combat focus.

      Director Maxwell Stiles has hit the ground running, hosting events in the PU with an emphasis on using teamwork to complete complex objectives, such as the Hathor Mining Platform.

      Behind the scenes the MSS and the USC have been gearing up for a refresh, brainstorming and parsing through what has worked in the past and what has not as we move forward.

      2025 has seen Star Citizen pivot to Master Modes with an overall emphasis on slower ship to ship combat. Recent additions to gameplay such as all ship medical beds becoming respawn points and no equipped armor or weapons being lost on death have fundamentally changed how FPS is conducted.

      The MSS has followed suit with less emphasis on hardcore gameplay for a more fun, organic approach to combat events.

      **Moving Forward - Our Mission in 2025**

      As we move forward in 2025 and beyond, the MSS has three main goals:

      **Generating content for combat focused gameplay**

      **Filling vacant directors positions**

      **Creating an organic, evolving approach to combat operations**

      The first goal is the easiest to implement. Director Stiles and I have both agreed to host at least one event per month each, starting in June 2025. This will ensure at the very least two combat focused events each month courtesy of the MSS.

      The second goal of filling the vacant director positions is really a focus on filling out the FPS focused department, Department of Marine Corps. As mentioned previously there is very little gameplay to support a civil police force at this time. Interested applicants please contact Twilly Frost for an opportunity to share your time and talent making the USC a safer place one bullet at a time.

      The third goal is the most nebulous, but perhaps the most important. Director Stiles and I have agreed that attempts to formalize the combat arm of the USC in the past have been more of a barrier to progress rather than a boon.

      Moving forward the MSS will seek to implement standards through participation rather than certification. While posting a link to a comms etiquette Google sheet with 200 terms can be useful, it’s more helpful to create an event with push-to-talk so that people can observe the process in action and slowly become comfortable with the idea of stricter comms.

      In this same manner all of our processes and preferences can be applied through organic means. Watching how an experienced FPS team clears a room or a fighter wing engages an unknown element is leaps and bounds more instructive than a spreadsheet or video tutorial. Participating in the process takes it to the next level.

      It doesn’t have to be perfect, we’re in alpha. The meta will always change, best practices will evolve alongside tried and true methods.

      This game is ever changing, so the MSS must change with it, and have fun in the process to encourage participation.
