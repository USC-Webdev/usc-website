    kicker: ""
    body: |
      Zan (Interim)

      As Interim Minister of Interstellar Commerce, there are three main goals for this year that I’d like to realize.

      Firstly create some unique, lore-driven content by hosting our own USC Cargolympics event where our Citizens can show off their hauling, box-stacking,freight elevator-loading and blockade running skills. This will definitely be a joint effort, month-long event and it may eventually grow into an inter-org competition if we’re successful.

      Additionally, with crafting around the corner and more org-driven content being released where going solo is definitely a drawback, we are focusing our efforts in bringing our inventory management and stock-keeping processes to the next level. Until CIG grants us the necessary tools in-game to share resources, post internal orders and fulfil quota’s, we’ll be building an easy-to-use app for all these logistical needs. Thanks to the tech wizardry of Ehriqhck!

      Last but not least my goal as interim Minister is to see the right people filling the open seats in our Ministry. People that love to trade, haul, track, collect, sport and travel. As the need for coordinated gameplay and shared goals grows, so should MIC!
