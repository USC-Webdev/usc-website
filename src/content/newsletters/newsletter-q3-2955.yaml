  - heading: From The Minister Of Exploration
    kicker: ""
    body: |
      **Quintero**

      As Minister of Intelligence and Exploration, I’d like to start by saying this is shaping up to be a great year.

      For many years, Exploration content has lagged behind more broadly appealing or foundational mechanics like shooting and cargo. The release of 4.0 was a huge milestone, and one that brought with it a renewed fervor for Exploration, and a new need for Intelligence. The release of Pyro brought so much to explore, and Citizens across all of the USC were hosting and participating in events to get out there and experience it.

      This heightened activity brought with it some fresh new talent, and the Cabinet was happy to announce the first selection of a MIE Director, with the selection of Jichael Mackson as Director of the Office of Naval Intelligence.

      We’ve had some outstanding events so far this year, such as a Pyro Exploration Events, a Scavenger Hunt Mission Task Order, a Newcomer Event (potentially a good recurring ACRE style event), a Stealth RP Infiltration Event, and a Stanton Retrospective (“the Secrets of Stanton”). There are many more to come, including some “special operations” that we can’t say any more about.

      If anyone would like to help Jichael out with planning of ONI missions, or is passionate about stepping into a role with ACRE or OCS, please reach out!

      With content like Hathor coming online, the role of recon and advanced scouts for large events is becoming all the more important…providing crucial intel on potential threats, both human and, more terrifyingly, corrupted servers.
