  - heading: Constitution Day USC
    kicker: ""
    body: |
      January 9th 2949 is the day the USC ratified its original constitution, officially resolving to call Terra home and formulate the current structure of the government and our society as a collection of independent contractors offering out of our own volition, "time, talent and treasure" for the betterment of our society.

      Constitution day is usually spent with family and friends. Also, although citizens can do this at any time in the year, It is customary on this day to write a letter to a citizen's constituent senators to make sure that his family's wishes and concerns are properly voiced at the Senate. Citizens also sometimes take the opportunity to participate in various community volunteer activities demonstrating the USC's citizens willingness to support each other in times of need.
