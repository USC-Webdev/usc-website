  - heading: Operation Kurofune
    kicker: Featured Events
    body: |
      _A Few In-Game & Out Of Game Events Our Members Created And Participated In_

      Due to the continued shadow blockade of Levski by the UEE, which has been slowly depleting the already limited supplies of the Peoples Alliance, the United Space Confederation (USC) decided to dispatch a relief convoy to Levski, delivering much-needed aid. To achieve this, Operation Kurofune was launched under the joint auspices of the Ministry of Interstellar Commerce (MIC) and the Ministry of Security Services (MSS).

      When first conceived, the convoy was not expected to encounter any significant resistance. However, following [the Massacre of the Expeditionary Fleet at the Nyx Gateway](https://thecitizencompass.com/2025/12/01/massacre-at-the-nyx-gateway-mie-expedition-ambushed/), plans were rapidly revised and MSS involvement was significantly increased. The loss of the expeditionary fleet was already a severe blow, and its full consequences had yet to unfold—losing an entire supply convoy on top of that would be catastrophic.

      Follow this link to read more and to watch Etow's journalistic video: [https://thecitizencompass.com/2025/12/13/operation-kurofune-successful-resupply-of-levski/](https://thecitizencompass.com/2025/12/13/operation-kurofune-successful-resupply-of-levski/)

      PSA: All members are allowed and encouraged to create group gameplay events. Reach out to any member of the admin team to learn more!
