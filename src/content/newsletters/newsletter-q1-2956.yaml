  - heading: Prime Minister Elections for First Half 2956 DEC 2955 (Closed)
    kicker: ""
    body: |
      Good Day Dear @Citizen s,

      The voting for our next prime minister has concluded and I am here to inform you all that @MaxwellStiles (UTC-5) will be our next PM starting first thing the first of January.

      His term will be for a duration of 6 months, ending on June 30th 2956.

      Max will still hold his Directorship at the Office of Naval Planning unless he plans to delegate (at his discretion and approval of the Minister of MSS) the task while serving as PM.

      Please join me in wishing Max success in his new role! May we all benefit from his tenure and the USC better for it.

      We would also of course like to thank @Kaïn (UTC+1) very much for his contributions during his interim tenure as PM.

      We see that his initiative with the new USC private enterprises is already starting to bare fruit.

      Do stay tuned in about 11 days for the first Senate Session of 2956.

      To all I wish you a very happy new year, with best wishes of prosperity, happiness and health to you and all your loved ones.
