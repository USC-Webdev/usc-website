  - heading: From The Minister Of Security - MSS
    kicker: ""
    body: |
      **Twilly Frost**

      **Ministry of Security Services**

      Greeting Citizens!

      This past quarter saw a lull in activity across the board as Star Citizen struggles to get its PU legs steady for 2026, while CIG continues its mad sprint to Squadron 42 later this year (allegedly). This project has always been about peaks and valleys, bursts of fresh excitement followed by periods of 'hurry up and wait'.

      4.7 brings a new opportunity for the MSS to get its hands dirty, as armor comes into play and the light fighter meta finally (maybe) gets kicked to the proverbial curb. Gone are the days of mindless orbiting whilst holding out for the end of a hardly-fought battle of attrition. No more strapping on laser repeaters by default.

      Under the armor paradigm we will see a new role for fighters emerge, a focus on sub-system targeting, anti-torpedo and anti-bomber tactics. And, of course, as an anti-fighter screen. Fighters will escort larger ships with the mandate of keeping said components safe from other fighters.

      Weapons loadouts will be integral to the success of a mission. Together with ONI, the MSS will test these new systems under fire, and be tasked with creating new meta suggestions and effective counters for various scenarios, starting with the Carrier Operations event being held by the Office of Fleet Planning.

      This next quarter will prove to be an interesting one for space combat. Strap on your best loadout and lets get to blowing things up for science!

      One last thing - the Director of Marines position is still available for anyone with a year of citizenship and a desire to coordinate and create content for all things FPS. If you have the desire and motivation, your time of citizenship may be negotiable.

      ad astra in proelium
