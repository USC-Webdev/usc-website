  - heading: From The Minister Of Exploration
    kicker: ""
    body: |
      **Quintero**

      Citizens,

      It feels like the last couple of months flew by with quantum travel speed…

      The verse felt a little quieter, especially with the usual cranky holiday and new year’s patches.

      But we are glad to have used the slower pace for pushing out a few “memorable” events, as well as looking inward to do some house cleaning and prep work for some things to be announced in the future. We want to use the chance to remind everyone here about the recent Security advisory, we have published on January 23rd , on “Counterintelligence and Operational Security”.

      Please take a look at the Discord Citizen Announcement channel and help us keep the USC a safe space.

      We are also glad to have seen some reinforcements in our MIE ranks from new citizens and were excited to see many explorers of you charting out Nyx after its launch and giving Pyro and its beauty a little bit more explorational focus – while Stanton was moaning under the traffic of the free fly and Alliance Aid.

      Having said that, lets revisit what happened in MIE during late Q4 and Q1:

      Starting with Operations Starforge – with special shoutout to our Citizen “Bar” for organizing -

      about 36 members participated across the 3 phases to identify Frontier Fighter plans, cripple their facilities, and finally to take down their leader.

      In the end, this event ran for a few weeks and, most importantly, members had fun and extra incentive (total of 150+mill aUEC of bounty have been awarded) to engage in content they might not have otherwise tried out.

      Followed by Operation Silent Cinder, our mettle was yet again tested when we planned to take down the Apex Valakkar on Pyro I. We learned once more that the Lazarus hub is not just a continued bug fest, but also operational security cannot be taken seriously enough. Nonetheless we have come out stronger from the experience and took a lot of good lessons to refine our future practices.

      One clear highlight for MIE but also the USC was surely Operation Padua Redemption – with a special shoutout to our Citizen “Etow” for organizing and planning.

      This was our first-in-a-long-time Org-vs-Org event, ending in an amazing live scavenger hunt competition with the Elysian Alliance across Stanton and Pyro.

      We know Etow is already planning a “second season” with Elya so we are more than excited to see the story unfold further in the coming months.

      In addition, we had a lot of fun in our very first “Outpost Conquest” FPS Practice event in Pyro on Fuego, which offered us a good baseline for what is possible in the game when it comes to live FPS and where things might still be a bit “wonky”. (edited)Thursday, March 5, 2026 11:04 PM

      Last but not least, we want to highlight – although not being MIE led or Ministry exclusive – that we are shifting gears to have the USC ready to participate in the next Daymar Rally in 2957. As a result will be looking for willing explorers to help us chart out courses and tracks across the verse where we can train in peace in the coming months. We will share more information and Task Orders soon!

      Thank you for your contributions and efforts to the USC in the last months and we are hoping for a great year of Exploration and Intelligence gameplay ahead of us.

      **Fly safe**

      Quintero & Jichael
