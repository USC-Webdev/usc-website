  - heading: Office of Fleet Engineering
    kicker: ""
    body: |
      **Fleet Engineering Director - Farrister**

      Role Description:

      - Oversee & ensure generation of repair and refueling support mission content. Typically, as a supporting role in a larger mission.
      - Assess USC naval needs for engineering process improvements.
      - Assess USC naval load-out effectiveness & recommend optimizations to navy leadership.

      Almost unexpectedly, Q1 was the first full quarter we had with basic engineering gameplay. Much still needs to be done, including tuning the system, but we have started to experiment with a content agenda.

      Farrister released an initial guide to engineering video, which forms the foundations of how we expect to interact with engineering at an operational level. And we ran our first dedicated engineering event, to practice fighting some fires and fixing things.

      Sadly due to the system still being in it's infancy, we didn't do much fixing, but did have plenty of fun. In the coming quarter, expect to see more of this, especially as we prepare for missions into Rock Breaker and potentially later in the year, the Tactical Strike Groups
