  - heading: A Word From The Minister Of State Affairs
    kicker: ""
    body: |
      **Landscaper**

      Hey Y’all!!

      The USC is off to a great start in the new year! A special "Thank You" to all of you, the membership, for helping out and participating! Here are the highlights of just a few of the awesome events, contributions and shenanigans during this quarter:

      **Main Topic**

      RidgeSix accepted the Director of Industrial Engineering role. His contributions are having an immediate impact, and we look forward to his content as the gameplay develops. Thank you Ridge.

      Ogi accepted the Director of the Office of Diplomatic Affairs. He is highly regarded around the org, he is organizing and managing the new external embassy Discord. The USC looks forward to his community relations efforts.

      Group Gameplay Creation:

      As mentioned in the newsletter section above, the strategy of allowing members to create group gameplay content is gaining traction. 2956 looks promising with crafting, salvaging and fleet rebalance on the horizon in patch 4.7.

      USC Lore and Roleplay:

      While the USC doesn’t impose role play, tying in the USC’s backstory with the storyline that CIG is developing is a great opportunity some of our members are leveraging for the eventual enjoyment of all members.

      Etow the Salty Cat has volunteered to update the USC Handbook. Looking forward to that! Etow and I will work on the next newsletter so that I can get it out on time.

      Mentoring:

      If you’re new to the game, or returning, feel free to check out the Mentoring channel on the USC Discord. Just giving a bit of advice, or taking a player under your wing is most appreciated!

      On Boarding:

      We could use some help with On-Boarding. While not as simple as mentoring, any help you could afford is appreciated.

      Special thanks to Wendigo and Gravitas for signing up to help. But we certainly need more help plz!

      Ministries:

      We still have many vacant leadership roles, including the Minister of Interstellar Commerce. We have to get these filled so our members' group gameplay activities are properly supported. Reach out to Landscaper today to discuss your interest, I’m happy to help. We’re super excited to see these roles develop as we get closer to the launch of 1.0.

      Every contribution, regardless of size, is helping the USC to be the place where we all can enjoy Star Citizen together as a group. We are now seeing good momentum and are so excited to support all that you contribute to your organization.

      **“Let’s Fly.”**

      Keep an eye on our Discord server for announcements, upcoming events, and ways you can contribute to the USC!
