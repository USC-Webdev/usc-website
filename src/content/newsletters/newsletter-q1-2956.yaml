  - heading: Confederation Health Services
    kicker: ""
    body: |
      **Director Fallon "Siren" Carter**

      RSI Apollo Medivac & Apollo Triage Enter Service (ROLLOVER ARTICLE - DUE TO MEDICAL UPDATES)

      After much anticipation, Roberts Space Industries has officially rolled out the RSI Apollo Medivac and RSI Apollo Triage to the civilian and organizational fleets across the ‘verse. These long-awaited medical ships, renowned for their versatility, efficiency, and field-ready design, have now made their way into USC’s expanding medical division.

      While the Apollo-class vessels have formally entered service, our USC fleet has only just begun receiving the first units from the latest production run. Each ship is undergoing extensive inspection and outfitting to ensure compliance with both USC standards and RSI’s advanced medical protocols. From hull integrity checks to medbay calibration, our engineering and medical teams are leaving nothing to chance.

      However, full operational readiness will require additional funding and logistical support. These new vessels are state-of-the-art but demand substantial resources to stock, maintain, and crew effectively. Efforts are currently underway to secure the appropriate funding and MedGel supplies needed to ensure each Apollo is fully mission-ready, from triage stabilization kits to emergency evac supplies with both Tier 1 and Tier 2 facilities available.

      Until then, the Apollo Medivac and Apollo Triage stand as symbols of USC’s unwavering commitment to life-saving response across the stars. Their arrival marks the next step in our ongoing mission: to bring hope and healing to even the most remote frontiers.

      While the above ships represent a significant enhancement to USC’s field of medical capability, it is important to note that current assets are not yet fully mission-ready, so it is with my firmest belief that we need to ensure our members have the necessary trauma impact readiness and necessary pharmaceuticals on hand for all ongoing missions. Personnel are advised to familiarize themselves with each medication’s properties and proper application.

      #### HEMOZAL (Red Label)

      **Primary Function: Hemostatic and Revitalization Agent**

      Hemozal is the frontline compound for treating active hemorrhage and critical trauma. It stops bleeding, restores patient health to their current maximum threshold, and can revive those in incapacitated states when administered promptly. Due to its potency, dosage regulation is essential to prevent circulatory shock.

      #### DEXEMATRINE (Purple Label)

      **Primary Function: Neuromuscular Stabilizer**

      Designed to relieve muscle fatigue and concussion symptoms, Dexematrine is recommended for personnel suffering from blunt-force trauma or extended exertion in the field. It promotes neurological clarity and muscular recovery, allowing soldiers to regain operational focus rapidly.

      #### ROXAPHEN (Green Label)

      **Primary Function: Motor Function Support Agent**

      Roxaphen is utilized to alleviate impairments affecting limb movement, particularly from fractures, sprains, or deep tissue injury. It reduces localized pain and inflammation, improving the patient’s mobility and dexterity for short-term operational readiness.

      #### STEROGEN (Orange Label)

      **Primary Function: Respiratory and Muscular Recovery Agent**

      Sterogen mitigates symptoms caused by chest trauma, muscular weakness, and respiratory distress. Often paired with oxygen therapy, it stabilizes breathing and restores muscle efficiency following blunt or concussive impacts to the torso.

      #### RESURGERA (Blue Label)

      **Primary Function: Biochemical Detoxification Agent**

      Resurgera serves to reduce Blood Drug Level (BDL) accumulation and counteract symptoms of overdose or toxic shock. It should be administered under controlled conditions, particularly in cases of multiple stimulant or painkiller use.

      #### CANOIODIDE (Yellow Label)

      **Primary Function: Anti-Radiation Compound**

      Canoiodide is the designated treatment for radiation exposure and contamination symptoms. It binds to harmful isotopes and assists the body in purging them through natural metabolic processes. Repeated doses may be required depending on exposure severity.

      Medical Division Advisory:

      All Apollo-class Medivac and Triage vessels are to maintain an adequate stock of the above compounds as part of their emergency inventory. Field medics are reminded that drug interactions remain a primary cause of treatment failure, administer with precision, and log all dosages to the ship’s medical record system.
