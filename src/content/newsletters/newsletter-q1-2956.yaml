  - heading: Proposal for a Formal Alliance with the "People's Alliance" of NYX FEB 2956 (Closed)
    kicker: ""
    body: |
      Dear @Citizen of the USC,

      As this new topic comes to a close, The results thus follows:

      On the matter of forming a partnership with the People's alliance of Nyx, The USC has voted in Favor of a limited agreement in the form of a non-aggression pact and Military treaty which includes select protection agreements. This had gathered 50% of the votes.

      Adding the 42.5% votes that were in favor a complete alliance, we largely surpass the 60% needed to move forward on a treaty or agreement with a foreign Organization as prescribed in Article II, Section 6 which requires at least 60% in favor.

      The form that this agreement would take, I would like to reiterate, would be the non-aggression pact as it is the camp that had the majority of votes between the two camps in favor of some sort of treaty.

      I would like to wish you all a good day
