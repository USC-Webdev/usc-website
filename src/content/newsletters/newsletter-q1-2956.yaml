  - heading: Coramor Star Citizen
    kicker: ""
    body: |
      In-Lore History: Based on the tragic 25th-century story of Yuri Ilyin, who spent his life searching for his lover Corazon Tan after a jump point collapsed, leaving her stranded.

      Coramor Activities: Players often participate in themed activities, such as wearing red/pink, trading specially marked items, and taking romantic scenic tours of the, which is the theme of the holiday.

      Rewards & Sales: The event brings back ships like the Heartseeker and offers themed items like plushies, armor, and weapon skins.

      Referral Bonuses: During the event, special gifts are frequently offered for using referral codes, such as special armor sets or ship paints, such as the HoverQuad with love-struck paint.
