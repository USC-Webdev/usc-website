  - heading: Description
    kicker: ""
    body: |
      VoidLink is our new custom VOIP solution for squad leads and commanders during large events.

      It also works as a companion to Star Citizen by reading the game log file which is generated every time you play a session. VoidLink can then generate a mission debrief, summarising your play session, including events and missions, a galaxy map is also shown as part of this report which highlights planets and moons you have visited. Coming soon this map will also indicate where certain events happened, like mission completion, deaths etc.

      VoidLink is available to everyone now, not just mission commanders and squad leaders, Your level of access is set t only use the tools (Mission debrief report generator, Mission report archive, Ship manifest and Hostile registry) within the app as default.

      If you step up to be a squad lead during an event your permissions can be changed by an admin to allow you to have full access.oidLink is our new custom VOIP solution for squad leads and commanders during large events.

      It also works as a companion to Star Citizen by reading the game log file which is generated every time you play a session. VoidLink can then generate a mission debrief, summarising your play session, including events and missions, a galaxy map is also shown as part of this report which highlights planets and moons you have visited. Coming soon this map will also indicate where certain events happened, like mission completion, deaths etc.
    gallery: []
  - heading: Features
    kicker: ""
    body: |
      Multi-channel PTT Voip for comms - Voice transmission to specific channels within VoidLink and Discord. Immersive push button commands to inform users of your squads status, or give orders.

      Mission Report generator - Generates a mission report for your current/last gameplay session by reading your game log. If the setting is enabled VoidLink will take automated screenshots at key moments, triggered by the game log. For example you accept or complete a mission, you are killed or attacked. These images are used to create a more detailed report and hopefully soon populate the Hostile Registry with hostile player names.

      Mission Log Archive - see your previously generated reports and view the galaxy map.

      Mission planner - for use during an event with multiple objectives. Commanders can create an objective list which is displayed to all users of VL, objects can be ticked off as the mission progresses. This objective list also forms part of a mission report.

      Cargo Manifest - Each squad can enter their ships payload or any important items they may be responsible for. Other users can then view who has what rather than asking around clogging comms.

      Hostile Registry (still in development) - Users can enter gamer tags of other troublesome players who commit crimes against us or are general threat. VoidLink should also populate this from any dynamic screenshots taken that include the hostile player's name. Users can enter hostile to the list either in app or via a Discord command.

      Discord integration - VoidLink can mute/deafen you in Discord automatically when you are transmitting voice in VoidLink. A number of Discord bots can be summoned to receive and playback Voip and commands for users in Discord.

      Fleet Report - If a group of players are using VoidLink for an event or operation all users can upload their game log file to the VoidLink server. The commander can then generate a fleet report which will include details from everyone's experience.

      Patholo
