  - heading: Day of the Vara Star Citizen
    kicker: ""
    body: |
      Day of the Vara is a holiday celebrated in the United Empire of Earth (UEE) annually on October 27th. The holiday involves public festivals adorned with decorations in black and green and private gatherings convened to remember and honor the dead.

      Celebrants dress up as people who have passed away or in other costumes and swap scary stories, especially pertaining to mysterious incidents in space. It is seen by Humans as a day that gives equal weight to the joy of life and the macabre.

      Read more at [Galactapedia](https://robertsspaceindustries.com/galactapedia/article/RkGQqpJwGp-day-of-the-vara)
