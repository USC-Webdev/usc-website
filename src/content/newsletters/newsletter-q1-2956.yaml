  - heading: USC Constitution Review and Amendments JAN 2956 (Closed)
    kicker: ""
    body: |
      Dear @Citizen , due to an oversight brought to my attention by @EtowTheSaltyCat (UTC+1) , I am considering making the slight adjustment as follows for Proposal 1.

      "New Cabinet Ministers (Including the Prime Minister) will need to have their nomination confirmed by at least 2/3s of existing Cabinet Members and need to pass a 75% vote from Senate (51% for the Prime Minister) in order to claim that title. In the case of Cabinet Consuls, the Consul of Peace is selected as informed by Article III Section 4 by Cabinet from within Cabinet and requires a unanimous vote. The Consul of War is selected as informed by Article III Section 3 and requires a 75% Vote from the "Leadership of the Confederation Navy""

      The reason for the edit is that in the case of an election with two or more candidates for PM, the 75% threshold would be very excessively difficulty to reach... Seeing the temporary nature of the Prime Minister Role, a simple majority seems acceptable.

      As it is not customary to change the wording of any votes when the polls have been published, I would like to get at least 10 Thumbs up reactions to this message. If I do get them, I will modify the text as indicated and will notify everyone so that they may change their votes if so desired.

      Senate Topic Final Results Report:

      Ladies and gentlemen, after some indeed very passionate debates, we now have the results of this year's constitution amendment votes.

      Just a quick reminder on the proceedings, a vote for 75% to agree on a proposed change is required to validate and ratify that change in the Constitution.

      Only the votes to Agree and disagree count towards the total. Abstentions are only counted towards Quorum which was set at 25 for all proposals.

      All proposals have met the Quorum so Let us get right into the results:

      **First, on change proposal 1: PASSED**

      with 26 total votes:

      77% (20/26) Has Agreed. The motion passes.

      What does this mean? TLDR It means that now new aspiring cabinet members will require the approval of 2/3s of the existing cabinet to be nominated and then require at least a 75% approval from our citizens to be able to be confirmed for that role. (only 51% for the Prime Minister). The consul of peace will need to be unanimously selected by the cabinet and the consul of war will require a 75% approval from the Leadership of the Confederation Navy.

      **On change Proposal 2: PASSED**

      with a 100% approval rate (37 votes in favor) The motion also passes.

      What does this mean? TLDR, Individual Cabinet members will only get 1 vote within Cabinet even if they are filling in in interim for an empty seat. They will only have one official job and will never be able to hold two seats permanently.

      **On Change Proposal 3: PASSED**

      Again with a 100% Approval rate (34 votes in favor) This one also passes.

      What does this mean? TLDR, MIC has now a more precise list of responsibilities namely: Trade, Business Management, Hospitality, Sports Entertainment (and gambling), logistics (Transportation of both goods and people), Management of the USC treasury, financing, and taxation.

      And last but not least...

      **Change Proposal 4: REJECTED**

      With 34 total votes,

      Only 68% (23/34 in favor) Have agreed and thus not reaching the necessary 75% approval to pass the motion. This motion fails

      What does this mean? TLDR, The move of Salvage and Mining activities will remain at the status quo under MES. Although this change has been passed by a previous senate vote, It's passing into the constitution has failed thus indicating that a strong contingent of our citizens reject this change. More discussions and polish will be required on this motion in order for it to find it's way officially within MIC...

      Call this a filibuster if you will but I encourage you to see this as chance for us to get back to the discussion table to polish a bit more this rough edge. Hopefully into something that works for the greater majority in the future.

      I will make the necessary changes in "The big book" and update the document according to these results.

      Stay tuned for the next topic in a bout one week's time.

      I wish you all a great day!
