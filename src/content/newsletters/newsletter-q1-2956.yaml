  - heading: Office Fleet Planning
    kicker: ""
    body: |
      **Director Maxwell Stiles**

      Hello Citizens and Residents of the USC.

      This past quarter didn’t see much activity from my office due to the lack of new content and the game feeling a bit stale for me. However, I now find myself with passions reignited with the promise of massive changes to space combat, thanks to changes to ship armor and radar coming with SC LIVE version Alpha 4.7.

      Starting with an event titled “Carrier Operations” I will be starting a series of events that will serve as learning opportunities for us to do a trial by fire and see which squad or fleet doctrines, carry the greatest weight for an org of our size, at least for the foreseeable future as all of this is subject to change whenever Chris Roberts chooses.

      Training will revolve around two major pillars. First one being, using fighters alongside bigger ships to take on targets with maximum efficiency. This means highly focused and high-level coordination. Second pillar will center around field logistics and learning how to quickly refit our fighters in the middle of a fight through the use of a carrier in order to quickly adapt to the threats we find ourselves facing.

      I look forward to working with all of you to achieve great things in the next quarter and beyond.

      Sincerely,

      **Maxwell Stiles**

      Director Office of Fleet Planning
