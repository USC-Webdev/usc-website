  - heading: Department of Industrial Engineering
    kicker: ""
    body: |
      **Director Ridge Six**

      The upcoming 4.7 patch introduces one of the most anticipated systems in Star Citizen - Crafting. With the arrival of the RediMake Item Fabricator, players can now craft a variety of FPS equipment, including armor, weapons, and ammunition. This marks the first phase of what will eventually become a much broader manufacturing system in the game.

      The RediMake Fabricator can be found in the "Other" category via the Freight Management kiosk in your hangar (simply search for "fab"). If you cannot see one there, they can be purchased at L1/L2 refinery stations, as well as refineries in Pyro and Nyx.

      Crafting begins with acquiring blueprints. In the current 4.7 PTU implementation, blueprints are earned as rewards for completing specific missions. A very helpful resource for tracking these rewards is https://scmdb.net/, which includes a blueprint category filter that shows which missions grant specific blueprints. As with everything in development, these systems are subject to change as CIG continues refining the feature.

      At present, blueprints are not physical items that can be traded between players (unfortunately, in my opinion). Instead, they are tied directly to your character once earned. The only way to view which blueprints you currently own is by accessing the crafting tab within a Fabricator UI. Hopefully in the future we will see a more convenient system—such as viewing blueprints through the MobiGlas—but for now the Fabricator serves as the central hub for crafting management. Selecting a blueprint in the crafting tab of the Fabricator UI displays what materials are needed in order to craft that item.

      The Fabricator is also capable of dismantling armor and weapons. To do this, players must attach items onto the Fabricator’s internal grid, close the unit, and use the dismantling tab in the interface. Dismantling provides you with a small portion of the materials used to create those items. Material quality ratings with dismantling have shifted several times during the Tech Preview and PTU cycles, so we will see how those values settle once 4.7 reaches LIVE.

      Depending on the blueprint, crafting may require materials with a minimum quality rating, so be mindful of that. All required materials—refined ores and gems—must be stored in local inventory, as the Fabricator pulls directly from that storage when crafting items. Once an item is completed, it can either be delivered to the Fabricator’s grid or directly to local inventory.

      Patch 4.7 also brings significant updates to mining, which will play a major role in supplying the materials needed for crafting. Rock and asteroid compositions have been reworked to include multiple ores and materials, along with varying amounts of inert material. Each resource within a rock now has its own quality rating (except inert material), which becomes visible after scanning.

      Rocks and asteroids can appear in clusters, with each rock sharing the same material types but differing in quality levels. Miners will also notice several quality-of-life improvements: The dominant material in a rock can now be identified from several kilometers away, and unknown signals can be scanned from long distances to determine their composition before approaching. Additionally, the updated star map now displays the types of minable resources present on planets and moons when selected. Together, these changes dramatically improve resource discovery and reduce the time spent scanning individual rocks while mining.

      Crafting in 4.7 represents only the first phase of a much larger industrial gameplay loop. While we can currently produce armor and weapons, the system will undoubtedly expand in future patches to include a much wider range of equipment and manufacturing capabilities.

      The future of industrial gameplay in Star Citizen—mining, refining, and crafting—is looking very bright with 4.7.

      For USC citizens who want a walkthrough of these systems, I’ve also created a video overview covering the new Fabricator, crafting workflow, and mining updates. I hope you find it helpful as you begin exploring these new mechanics. - [https://www.youtube.com/watch?v=LZmsuq9sr_o](https://www.youtube.com/watch?v=LZmsuq9sr_o)

      **RidgeSix**

      **Director of Industrial Engineering**

      Role Description:

      - Oversee the generation of mining and salvage missions.
      - Track participation in the mission types listed above.
      - Provide advice and support for citizens. considering placing claims on real estate, and track USC citizen-owned areas.
      - Oversee & ensure generation of base building missions and support.
      - Advise the USC on the path to being ready to engage in base building and establishing a true USC territorial foothold.
      - Oversees the activities that provides the USC with crafted and/or improved vehicles, components & equipment.
