  - heading: Private Citizen Trade Enterprises vis a vis USC Government Trade Opportunities OCT 2955 (Closed)
    kicker: ""
    body: |
      October:

      Good Day Dear @Citizens,

      Another topic now comes to a close and here are the results!

      Question 1:

      On the question asking what we should do when on official USC mission with rare loot obtained and found.

      76.47% Have indicated that the redistribution of the loot should be done using a Random Number Generator Method to keep things fair and equitable.

      23.53% Desired to have all rare loot be allocated to the USC Org treasury.

      **Questions 2a**

      This questions seeked to clarify if a set percentage of our treasury should be earmarked for trade and if so, how much.

      The responses reflected a nice spread across all possibilities however the two highest responses were as follows:

      50% Of votes advised that no guidelines should be hard set and that it would be at the discretion of individual traders. For the USC Treasury, at the discretion of the Minister of MIC as well as the Director of the Treasury and fleet Logistics.

      27.78% Wishes to set a percentage of 25% of USC inventory exclusively to trade and advised the same for private USC traders.

      **Question 2b**

      Now arguably the question that stirred the most discussion, How much of a discount should be considered fair when MIC sells from the org treasury to USC Citizens.

      The two top answers were as follows:

      50% Have indicated that our citizens should receive a 25% discount from market rate on loot sold from the org vaults.

      36.36% Would like that have seen a deeper discount at 35%.

      There you have it. I would like to thank all of you once again in assisting to make this the best ORG in the vers' It is though all your contributions, whether by organizing/participating in events, fostering constructive discussions, producing works of creative art and also by excessing your right as citizens to vote ont these topics which help us shape our organization to be a place that is home to us all.

      With the close of this topic, I am announcing that it is also bringing my current term as your Chancellor to a close. Announcing the results of the last poll of the term always leaves me with mixed feeling of accomplishment but also of feeling that so much more work is yet to be done...

      As is customary, I can neither confirm or deny if I will be putting my candidacy again for another two years. A communication will be sent out from Cabinet in the next few days.

      Until then, Thank you for the trust and honor you have given me to be your Chancellor this past 2 years. I am truly blessed to be part of this Organization and regardless of that lies ahead, I am confident that we are heading in the right direction.

      With most sincere regards,

      **Caylen Vyshir**

      Lifting my hat to all of you one last time (for this term) as your Chancellor.

      May the stars always shine in our favor.
