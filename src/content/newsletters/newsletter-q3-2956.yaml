  - heading: Confirmation Vote For Consul of War JUNE 2956
    kicker: ""
    body: |
      June:

      I (Chancellor Caylen) am here today to announce that we may have for the first time in the history of the USC, the opportunity to have all our Cabinet seats filled.

      Ladies and gentlemen of the United Space Confederation, our very own Thomas "mojomonkey" Farrister has just passed a nomination vote from our Directors and Cabinet in a first round of votes for the position of Consul of War. Now his candidacy is thus presented to the Senate for all our Citizen's approval and final confirmation.

      Kindly recall that the role of the Consul of War is to direct and coordinate the execution of our nation's strategic objectives (objectives that we all decide in Senate) as well as ensure the defense of our confederation. In the exercise of these responsibilities the Consul of War may source expertise from all ministries in coordination with other Cabinet members as well as relevant Directors. The role also may call upon the need to make quick decisions independently from other cabinet members should the safety of the Confederation, it's people and/or strategic assets be at risk.

      Do note that "strategic objectives" can have many meanings and not be limited to only the "defensive posture" of our Confederation but it could entail any number of goals involving cross ministry coordination.

      Finally, Just like any leadership role of the Confederation, this is a position not of power but of deep responsibility to all our Citizens

      Results:

      Today we have reached a milestone to be remembered and one that heralds the next stage of the USC’s development into the org that we’ve envisioned equipped to compete in a verse that is by nature PvP and at times unforgiving.

      With and an overwhelming 97.8% of votes in agreement (not counting abstentions) it is my honor to present to you @Thomas "mojomonkey" Farrister , the United Space Confederation’s Consul of War. Also known as the Grand Admiral of the USC Navy.

      Please join me in congratulating Farrister on his well deserved appointment. It’s my understanding that he has an acceptance speech or materials prepared so I will withhold my pings.

      or now however I want to highlight that this a great day for the USC and that we should all be proud of what we’ve built here together. This is but one of many steps that is continuing to build the best damn space org in Star Citizen.

      May the Stars always Shine in our favor.

      **Caylen**

      May the stars always shine in our favor.
