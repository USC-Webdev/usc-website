  - heading: Desk Of The Minister Of Security - MSS
    kicker: ""
    body: |
      **Twilly Frost**

      **Ministry of Security Services**

      Greetings from the Ministry of Security Services!

      A wise man once said, right before 4.8 "Gonna be interesting! And full of bugs!"

      Well, that was an understatement. But, from the ashes of that disaster of a patch came 4.9...which was still awful.

      4.10 has seen some improvements, and we've had a lot of combat related missions actually complete is a satisfactory manner.

      Let's check in:

      TSG: lots of bugs, specifically with the door to rescue the pilot being inaccessible. However, there were several successfully completed attempts, and we've learned a lot about how to complete the mission efficiently. Even when your capital ships can't allocate pips to weapons, we still found a way.

      Rock Breaker: Not bad, not great, but we managed to make a few successful runs and acquired some savrilium for the org.

      Vanduul Tech Smugglers: had some good runs, loot is still hit and miss.

      Siege of Orison: Many successful runs, but the loot is questionable. Still, a valuable resource for small squad team based FPS tactics.

      Return to Hathor: Many successful attempts, efficiently run and profitable. Still searching for that elusive Pure Caranite.

      Storm Breaker: A couple of nice runs, just recently we completed the fight and harvested pearls, fangs, and other useful equipment for the org stockpile.

      Overall things seem to be a little more stable, and org supplies are being replinished and bolstered.

      Props to the the citizens that made our combat ops so successful. With the introduction of the Navy and Tier 3 missions, there is a lot to be excited for in Q3-Q4.

      And probably more bugs. But we will continue to hold the line! Into Q2 2027 and maybe beyond.

      Much love to my space bros,

      **Twilly Frost**

      **Minister, MSS**

      ad astra in proelium
