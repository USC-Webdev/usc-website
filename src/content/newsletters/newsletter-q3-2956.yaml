  - heading: A Word From The Minister Of Commerce
    kicker: ""
    body: |
      **Maxwell**

      Hello USC!

      A brief word from the Ministry of Interstellar Commerce,

      We’re still waiting on ORG tools, player bases / outposts for storing supplies and setting up shops, better racing mechanics, and some actual touring gameplay mechanics.

      We did recently have some commodity runs by our amazing Citizens and Residents… although it seems one of the runs wasn’t exactly… successful. But that’s alright, we are all fighting a game that isn’t a released product and quite often works against us.

      The USC Bank recently resumed operations after CIG eased restrictions on exchanging aUEC. We still need both the sender and receiver to be online at the same time, however, the anemic 1 million aUEC limitation seems to have been eliminated, or at least raised to a point that doesn’t affect our operations.

      I would like extend a special thanks to BGThompson and USC_Admiral_Sheppard for stepping up as ORG Bankers to help manage the USC’s funds.

      Nyx I will be here before you know it, and we are looking forward to hosting some touring operations, perhaps even have some collaborative events with MIE our resident explorers!

      Until next time!

      Stiles out!

      The Minister of Commerce responsibilities are to:

      - Monitor USC in-game organizational finances, revenues and expenses
      - Provide a budget recommendation to the Cabinet each quarter, with allocations for each Ministry and the Navy for expenditures.
      - Oversee the USC Central Bank (USCCB)
      - Oversee the generation of Trade Convoy and Commodity Trading Missions.
      - Oversee the transport and shipping of essential USC supplies and equipment.
      - Oversee Touring and racing missions.
      - Manage Ship / Vehicle Replacement Program (SVRP)
