  - heading: The USC Stormwal Protection Act (USPA) August 2956
    kicker: ""
    body: |
      "There are no more noble and free creature in the universe than the breathtakingly mesmerizing Stormwal" , that sentence was quoted from Dr. Jasper Cint Markovy, the sponsor of this motion, from his last book, "The Creatures of Heaven". A book that has risen in popular culture as of late within the USC and which has brought to the attention of all the plight of these noble creatures.

      For as long as we have discovered these creatures, there would be those whom have hunted them for profit, fame or simply bragging rights. Others hunt them for scientific research or for sustenance. In any event, the hunting of these animals has caused outrage to the locals of Crusader and to those of our broader citizenship which see these animals as the pure manifestation of one of our core tenets, namely "Freedom"

      As you may know the USC has held for some time a large presence in Orison, Crusader and in it's time there, has formed a good relationship with the Company's Leadership and Community Representatives. Their lobbyists, led by Dr. Markovy has thus implored us to implement the USC Stormwal Protection Act (USPA) which would recognize the Stormwal as an endangered species and grant these animals a protected status. banning its illegal hunt.

      OOC: This is an RP, Lore building vote with no direct repercussions in game other than for background story building and inspiration. Do note that this might guide sentiments however and although the leadership will not punish anyone for hunting Stormwals should this pass, your co-citizens might not like it. That is all.

      Happy voting!
    gallery: []
  - heading: Desk Of The Consul Of War
    kicker: Ministry Round Up
    body: |
      _Navy (Placeholder)_

      **Thomas 'Mojo' Farrister**

      We have been developing our operation leader and planner guidelines via our N-COAT working group. N-COAT volunteers are responsible for building our training and accreditation schemes, and have started with the pipeline for people interested in running events.

      We have also built some tactical playbooks, as an off the shelf blueprint for common Navy activities. We are now focusing on field testing these materials with aspiring operation leaders, ahead of starting our first tour of duty in September. The tour of duty is an intense 6 week period, with a weekly theme and multiple events at different timezones to allow participation. Following our first tour of duty, we will start planning our second, whilst also considering any training requirements that arise from the first.

      There is still plenty of capacity to bring in new operations leaders, for interested parties who want to take a more active role in leading our most organised activities.
