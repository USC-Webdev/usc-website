  - heading: USC Goes on Patrol
    kicker: Featured Event
    body: |
      _A Few In-Game & Out Of Game Events Our Members Created And Participated In_

      The newly commissioned Idris class frigate USCS-Maelstrom is heading up a fleet for the first time into Nyx to help out the Peoples alliance fight various gangs and incursions in the system. The Maelstrom will be packed with missiles, ammunition and RMC to support a large wing of fighters. We will fly out together from PSS Delta after a short briefing aboard the Maelstrom, to fight whatever we encounter ! and hopefully make Nyx a little safer at the end of the day.
