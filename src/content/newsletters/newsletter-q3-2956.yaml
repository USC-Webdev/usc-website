  - heading: Profiles In Courage
    kicker: ""
    body: |
      _Notable Acts Of Bravery, Contribution And Integrity_

      **Farrister**

      Consul of War.

      Thomas 'mojomonkey' Farrister volunteered to join the leadership team as Minister of the NAVY and has hit the ground running! Currently he is building a team of content creators as well as building a process for creating org level events that we refer to as 'Operations'. During the next couple of Alpha builds, Farrister will test ideas, gather feedback and eventually create the group that will quide our collective goals across all Ministries and ensure all members have an opportunity to contribute to our success.

      Thank you Farrister. We look forward to your leadership and the awesome content you'll create along the way. :)

      **Ilucide**

      **Hangar Works App**

      Ilucide has created the [Hangar Works](https://www.sc-hangarworks.org/) app that allows orgs to organize their member owned: blueprints, crafting planner, shared organization stocks, an internal market, and order tracking — all in one place, synced across web, iOS, and Android.

      Thank you Ilucide for creating this awesome app and trusting your org-mates to help with testing. The membership is truly enjoying this tool and it only gets better with each build!

      Thank you Ilucide!

      **Picktrooper**

      Group gameplay creation efforts.

      Picktrooper has been truly dedicated when it comes to helping build the USC into the org it is today. Recently he stepped up to serve as the membership's Prime Minister. In this role, he will have a front row seat in the various leadership conversations that help to build the USC we all love and enjoy today.

      Thank you Pick and may the stars forever shine in your favor!

      Kil-Roy, BGThompson, LordAction, Etow, Patholo, Edgy, O-Stargazer

      Group gameplay creation efforts.

      Wow guys!

      We see you all, and appreciate you guys stepping up to create group gameplay events for the membership to participate in. This is the dream right here, and we're so happy to see our Citizens creating events and blazing the way... even while the game experiences a few rough spots in development!
