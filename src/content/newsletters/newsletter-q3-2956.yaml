intro: |
  NEWS FROM AROUND THE CONFEDERATION

  Year 2956 - Quarter 3 - Issue 2956.3 - Build 4.9.0 - 4.10.01
sections:
  - heading: The Office Of The Chancellor
    kicker: ""
    body: |
      Dear Citizens,

      In this quarter we've experienced a confident and continued up tick in activity across the board throughout the confederation.

      There once was a time, I won't deny, that the leadership feared that generating activity would be an ever lasting problem but I am so proud and relieved to see that we are continuing to see that activity growing. Not only in in game activity but in also out of game. RP Media reporting, video and media productions etc has been constantly delivered much to the delight of our citizens.

      That said, a slight lag has been observed between in what is being delivered by CIG vs expectations and that has been dragging down the USC but it is not in the slightest deterring our resolve... The will to have a great time together with what we've got is driving us ever forward. We've made great progress and the Navy, thanks to our very own Farrister, is getting wind in it's sails. Indeed the USC framework is in very good shape and we are proud to see the USC finally grow into it's own fully.

      Considering Senate topics lately, we've seen the put in place of our Consul of War, A.K.A the Grand Admiral Of the USC Navy, Farrister has been put in place as well as our latest prime Minister Pick Trooper. For the first time ever the Cabinet is fully staffed and the before mentioned framework is finding the "meat" on it's bones. Some work still has to be done to fill several key director positions but I want to highlight that we are supremely grateful for our existing directors work in their respective fields. Furthermore several RP related topics has graced the senate floor such as our recent vote on the Fate of Crusader's Stormwals. These topics has served to enrich the general culture and lore of our community. I would personally say that an RP vote is a vote held in a time empty of turmoil and for that I will warmly embrace. We should remember these times when 1.0 falls and more tumultuous questions be asked of our citizens...

      Citizens, bask in this moment of our shared success!... Yet do not rest on our shared laurels for more work has to be done. The chariot of our never ending quest toward progress demands of us diligence. Seeing Navy activity develop (Tier III Activities) has been a great step forward but it has also guided our attention towards individual Ministry activities and asked the question of how could we request our directors to more readily and proudly fly the flag of their ministries? To provide activity that is "more than casual but less than hardcore" and fill the "Tier II gap". Let us see where the road of our future leads.

      I remain yours truly.

      **Caylen Vyshir**

      **Chancellor of the Senate**

      **May the stars forever shine in our favor**

      **For Equality, Prosperity, and Freedom**

      **Caylen Vyshir**

      **Chancellor of the Senate**

      United Space Confederation
