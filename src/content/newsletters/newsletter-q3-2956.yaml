      **Director Ogi**

      Greetings all!

      Last quarter's update was, unfortunately, a duplicate of the Q1 update, which was my introduction as the Director of Diplomatic Support.

      I would like to acknowledge EtowSaltyCat’s superlative performance in coordinating the Mile ‘o Mayhem race with three other orgs. We had great participation, and Cat reports some interest in partnering with these orgs in the future.

      The iron I have in the fire is that I have a presence on one of our partner orgs (KarmaFleet), and I have the intention of occasionally jumping in game with them to show the USC flag, and engage in the sort of personal diplomacy that puts us in a good light. I am looking for other orgs to liaise with in a similar fashion.

      However, both Cat and I are running into a pretty common feeling that the game really isn’t in a suitable state to warrant a significant investment of time. Hopefully, game stability will improve, and that will allow ODS to perform our function more actively.

