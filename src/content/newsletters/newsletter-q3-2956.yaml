  - heading: Q3/Q4 Prime Minister JULY 2956
    kicker: ""
    body: |
      I (Chancellor Caylen) am happy to announce that we have received an applicant to the role of Prime Minister! Indeed the continuation of this role is important to the USC. It serves to constantly refresh the leadership and makes it so that any one of you may participate in the executive leadership of the USC, a foundational pillar supporting our ideals of Equality. Furthermore, it helps us old guys that's been here for a long time be held accountable and reinvigorated with fresh perspectives, ideas and energy!

      Today I am announcing that @Picktrooper has decided to present himself as candidate for Prime Minister.

      Results:

      The most contentious of PM elections yet. Will write a response soon but will indeed highlight that as per the current constitution @Picktrooper has been nominated as our current prime minister. Best wishes and luck to our new Prime Minister!

      Best Regards,

      Caylen
