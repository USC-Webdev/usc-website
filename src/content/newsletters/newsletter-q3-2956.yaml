    body: |
      [Watch the video](https://drive.google.com/file/d/1YbjqL3a6SkeB-U0Z-nyAB-CRkXf28_oi/view)

      **Zan**

      "Greetings fellow Citizens,

      I'll keep it short today, since I'm out here on Vuur, the rugged moon of Pyro V.

      This last quarter has been quite eventful for our Ministry of Engineering & Support. The USC industrial engine is finally spooling up with Director Ridgesix at the controls and many of you going above and beyond to supply our citizens with quality crafted goods.

      Meanwhile we're picking up rumours of long, multi-tier combat missions requiring large ships where our Engineers may finally prove their mettle and keep us in the fight. Especially against those blasted Vanduul. The USC still has a score to settle with those bloodthirsty aliens .. but I'll leave that for the MSS speech.

      And lastly I'm happy that I was able to pass on the Interstellar Commerce Ministry to our latest Cabinet member, Maxwell Stiles. Now I can finally focus on combining two of my passions. Roaming around in the vastness of space and its many planets, exploring and providing crafting, repair & supply services to our citizens who find themselves stranded beyond the civilized systems. Or perhaps a MIE pilot that happens to be in the neighbourhood. Definitely not checking up on me ... I'm sure.

      I'll see you out there, Citizens!

      Dr. Daesang Zaen, Minister of MES
