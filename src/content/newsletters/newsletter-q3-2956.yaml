  - heading: Group Gameplay Content
    kicker: ""
    body: |
      Special spotlight on some of our members that have created some phenomenal group gameplay content for all of us to enjoy! Thank you, hours of fun and gigabytes of video & images created.

      - To Kill a Titan - Now XenoThreat

      The Month got started off with the comeback of XenoThreat! Threatening the Stanton system once more through attacks on convoys and civilians across the system.

      To Counter that many USC Citizens organised several Events like this one from Kil-Roy to Halt and destroy the Xenothreat advance.

      Additionally, the Xenothreat Idris-M yielded many useful railguns for the Idris Owners in the USC.

      - Hang Out with HIGHCOM

      A special Event Organised by Mojomonkey for USC citizens to meet various USC Ministers during a relaxed, casual mining event.

      This is not the first nor last event of its kind and we look forward to more!

      - Recco Bagrindlia A Shift

      An event organised by BGThompson to check out the brand new REcco Battaglia missions in Nyx! Although initially buggy, the missions yielded quite the prizes or those that got to finish them.

      - Align & Mine

      Both Edgy Socrates and LordActon revived the Align and Mine Events, both organising several ventures to Daymar to activate the giant laser there and gather as much Carinite as possible.
