  - heading: Office Immigration & Resettlement
    kicker: ""
    body: |
      **Director Dekan**

      Summer is upon us, and our annual recruiting slow-down is in full swing while the northern hemisphere enjoys this thing that I think they call "outside". Even at the reduced rate, though, we are still receiving more applications than previous years! As of the time of this writing, we have processed 28 applications for this quarter and 17 Residents have gained Citizenship!

      This quarter also saw USC_Saint/Jamie join the team, a very welcome addition who hit the ground running. He has already been a tremendous help and we look forward to his continued contribution to the team.

      We would also like to remind everyone that hasn't done so yet to submit an application to the org on the RSI website at [https://robertsspaceindustries.com/en/orgs/USC](https://robertsspaceindustries.com/en/orgs/USC)

      As always, the on-boarding team is seeking more members willing to volunteer to help out. Recruiting tends to ebb and flow, and having additional eyeballs to review applications would help distribute the workload when it starts to ramp back up. To be considered, you need to be active in both Discord and in the PU and be willing to engage with new members. Tenure as a citizen, while still a consideration, is secondary to level of engagement. If you are interested in being on the front lines of helping our community grow, please reach out to either Landscaper or myself.

      Clear skies, fly safe (or not, depending on your preference), and I will see you in the 'verse!

      Role Description:

      - Create a top-tier recruitment thread for the RSI Spectrum forums.
      - Keep this thread regularly active so it remains on the first page.
      - Create a selection of top-tier recruitment posts for rotating in the RSI recruitment chat lobby.
      - Create one or more high-quality signatures for USC members to use.
      - Maintain an active presence in the “Becoming a Citizen” chat lobby
      - Maintain an active presence in the General forum, with a USC signature.
      - Process new member applications, and ensure they are appropriately tagged in Discord and Spectrum.
