  - heading: Department of Industrial Engineering
    kicker: ""
    body: |
      **Director Ridge Six**

      Hello, fellow citizens.

      Operations remained nice and busy for the Office of Industrial Engineering. During this past quarter, a formal USC Storehouse was developed within MES to manage and store shared org materials, particularly refined ores and gems of high quality and useful for crafting. USC Miners spent thousands of combined hours searching Stanton, Pyro, and Nyx for high-quality ores of various types to contribute to the storehouse. Overall, these operations were wildly successful and our office crafted dozens of armor pieces, flight suits, FPS weapons, ship weapons, and ship components over the past couple of months!

      During 4.8, we established MIC-L5 as the location of the USC Storehouse. This worked relatively well, but also felt a bit too far from useful locations. For 4.9, we moved to HUR-L1, which worked very well, providing a more central Stanton location. Well over 100 SCU of refined ore was donated to the org during 4.9, along with dozens of high-quality gems. A lot of crafting occurred, and we held two "Storehouse Events" that facilitated the exchange of goods in the safety of a hangar (both incoming donations and outgoing crafted items). Shifting to an event-based hand-off was well received and also allowed for the two storehouse managers (myself and Patholo) to be away from the storehouse location more than we could during 4.8. We will continue the practice of "Storehouse Events" moving forward, but we are moving the storehouse to Levski for 4.10. We will continue accepting donations of materials with a quality of 650+, with the exception of Savrilium, Stileron, and Sadaryx (which we will accept at any quality). Starting with this new 4.10 patch, refined ores AND their quality should persist from patch to patch, which is HUGE! This means we will be able to build a really strong supply of materials for USC use, and I look forward to seeing what we can build.

      Perhaps the most significant development in the Office of Industrial Engineering this past quarter was the development of the HangarWorks app by our very own Ilucide! Huge shout out of praise and appreciation to Ilucide for this monumental success! The HangarWorks app is now the central hub of org resource management and crafting. If any member of the org would like something crafted for them by the org, they simply need to request it in the app and one of the designated crafters will get on it if we have the blueprint (we have almost every blueprint). We are not currently charging anything for crafted items and only ask that the person requesting the item be an active member of the USC, participating in events every once in a while and/or donating to the storehouse or USC bank.

      One final thought - With the enlarged Battaglia ore bag blueprints being introduced with 4.10, I anticipate we will want to craft a strong supply of these large bags for our miners. This will require large amounts of 800+ quality Iron, so please consider 800+ Iron a top priority material for the storehouse. Other top priority items include savrilium (any quality), tungsten, sadaryx (any quality), stileron (any quality) and feynmaline.

      Here's to the continued success of MES operations related to Industrial Engineering. Cheers!

      **RidgeSix**

      **Director of Industrial Engineering**

