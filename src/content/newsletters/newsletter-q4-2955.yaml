intro: |
  NEWS FROM AROUND THE CONFEDERATION

  Year 2955 - Quarter 4 - Issue 2955.2 - Build 4.2
sections:
  - heading: A Word From The Chancellor
    kicker: ""
    body: |
      Dear Citizens of the Confederation,

      With shared dreams comes a shared goal. With that a shared responsibility.

      That responsibility is within us all when we've accepted to become citizens of our confederation.

      A responsibility to always exemplify what humanity should be at its best. To lead by example and to reject the temptation of purely personal gains, to focus on a shared prosperity, because we are all equal, no one gets left behind, and in the end we will be free because of our resolve to become the best that humanity has to offer.

      This past quarter the Senate has validated again the will to pursue the dream of our founders when they decided to branch off from the UEE all these years ago.

      - In July/August the Senate identified that it was a moral imperative to pursue freedom of traversal mission to protect our spheres of influence.
      - In September we decided to investigate reports pointing to the vile clandestine actions of private enterprises hiding their misdeeds under the obfuscation of UEE bureaucracy and legal jurisdictions.
      - October's vote will deliver an agreement regarding fair trade amongst our citizens and the rights to bounty while in the service of our government and people.

      This past quarter has been a great conclusion to my term. Indeed, after the conclusion of this October Senate session, it will be the culmination to my third term as your Chancellor and I could not be prouder of what we have achieved together.

      Every month and year that goes by our Confederation grows, the energy is electric, and we are on the verge of everything coming together as it was foreseen so many years ago.

      Looking to the future, I am without a doubt convinced of our success. I can neither confirm or deny if I will be running for another term, that is a duty reserved for Cabinet to announce.

      But rest assured that my passion, heart and indeed soul is with all of you.

      **For Equality, Prosperity, and Freedom**

      **Caylen Vyshir**

      **Chancellor of the Senate**

      United Space Confederation
