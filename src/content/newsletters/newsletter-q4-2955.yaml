  - heading: A Word From The Minister Of Engineering
    kicker: ""
    body: |
      **Zan**

      Greetings from our favourite support crew in MES,

      While the Ministry has had a brief revival with the appearance of the RSI Apollo ship line, the impact from the Regen Crisis seems barely noticeable for medical personnel. Medgel shortages have inflated the market and the cost of revivals has gone through the roof but we still haven't seen any significant increase in medical beacons or rescue requests. This does leave Siren and her team enough room to support all of our troops in the field on the various operations and expeditions that the USC has been launching lately.

      As for Engineering and crafting, it seems to be a waiting game but the recent leaks have reopened the Hopium valves and the future looks quite promising with Engineering T0 being actively developed, hopefully we'll see some of it appear in the PU in 2026. I for one can't wait to be putting out fires, replacing fuses, fixing components and running around like a headless chicken trying to keep your capital ships up and running in the heat of battle.

      Unfortunately our Director of Engineering, Shaka, has to step down due to real life priorities. So I want to use these few last lines to wish him the best and thank him for his great ideas. hopefully he'll be able to return to us at some point to continue working on his vision for an integrated Rapid Response unit.

      See you out in the asteroid fields,

      Dr. Daesang Zaen, minister of MES
