  - heading: Three Worlds Day USC
    kicker: ""
    body: |
      The 4th of December is the day where we pay homage to our lost civilization in the Oracle System.

      After losing two worlds to the relentless onslaught of the Vanduul, It is at this date that Admiral Cornhover detonated a classified wormhole nullifier device, destroying the jump point leading to the Oracle system, forever saving the United Space Confederation, it's core governmental entities and it's citizens.

      That distinguished act of valor saved millions of lives, allowing them to safely escape to Terra.

      The selfless sacrifice of those whom were unfortunately still on the the other side are forever remembered and honored on this day.

      This day is usually a solemn day marked by lighting 3 candles at night in front of a window, representing the three worlds we've lost and the people we've left behind.
