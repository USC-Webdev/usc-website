  - heading: From The Minister Of Security - MSS
    kicker: ""
    body: |
      **Twilly Frost**

      **Ministry of Security Services**

      Greeting Citizens!

      It's been an awesome quarter for group combat, once again spearheaded by our Director of Fleet Operations Maxwell Stiles.

      Back in last quarter's newsletter we laid out a road map for content that would be coming up from the MSS, and for the most part that content was delivered.

      We saw a lot of activity both in Stanton and Pyro, from curated events to ad hoc groups running contested zones.

      In all of these instances the groups were respectful, well led, and effective. It's safe to say that we had some fun too, which in the end is the ultimate objective. Winning is fun, right?

      This next quarter is going to see a new system come online, and with it will be new security challenges.

      In our last newsletter we talked about integrating combat across several different branches. Though we're still in the early stages of this initiative we have seen some positive results.

      With Nyx coming online in the next month it will be more important than ever to create an environment in which all of our ministries can work together towards common goals.

      There will be new logistical security challenges, such as cargo and player trading that will be further iterated upon in game with the introduction of Levski 2.0.

      Working to provide escorts for traders and haulers who are moving particularly sensitive goods while integrating useful intelligence to inform our planning will be a focus for integration with MIC and MES

      With the new combined arms activities on the horizon we are still looking for someone to fill the position of Director for the Department of Marine Corps.

      In general, interested applicants should have had citizenship status for at least a year, though exceptional service may find a way around this particular limitation. We are interested in talented individuals with ambition and the willingness to learn, the rest can be worked with.

      There are currently many suitable candidates for this position within our organization. If you think you might be interested then please contact Twilly Frost so we can discuss your ideas for the role that can be presented to the Cabinet for approval.

      This role is a content creation role, and you will be expected to create and participate in FPS content. The frequency and scale of such content can vary. Integration with Fleet Planning and other Ministries will also be intergal to the running of this department.

      Knowledge and aptitude for group FPS combat and a working knowledge of FPS combat in Star Citizen is a requirement, but talented individuals can many times grow into a role if the desire is there. If this sounds like you, I encourage you to apply.

      This has been a fantastic quarter for group combat within our organization, and it's a direct result of the citizens within our organization that show up and show out for these events. You have been terrific and we appreciate all of you.

      Same goes for our leadership, the directors that have been pushing content and helping guide other players through it. It's heartening to see and we look forward to providing a space where that kind of thing can continue well into the future.

      The MSS will continue building upon the progress we've made this quarter to make the verse the kind of place we all want to live and play in.

      See you in the verse!
