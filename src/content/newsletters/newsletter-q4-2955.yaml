  - heading: "Sicsemtyr Day Pronounced: sik'sem'tyr USC"
    kicker: ""
    body: |
      The origin of the word 'Sicsemtyr' comes from a famous Latin phrase "Sic Semper Tyrannis", which basically means: bad but just outcomes should or eventually will befall tyrants.

      It's a protest towards tyranny in all its forms and perhaps a silent protest in particular towards the UEE, alluding to past frictions that ultimately led the USC to succeed from the empire.

      This date is November 1st, but is usually held on the following weekend to allow most citizens the opportunity to participate. The weekend is marked by regional festivals, street food and parades that begin in the early morning till the early hours of the next.

      Citizens usually wear clothes in shades of purple. Masks have been created for this occasion that resembles Venetian masks of the old earth but that covers only half of the wearer's face. These masks represent the duality of humans. Both representing the good and the bad that one can represent and the choices that everyone makes in their daily lives.
