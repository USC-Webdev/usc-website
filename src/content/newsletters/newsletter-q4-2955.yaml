  - heading: From The Minister Of Exploration
    kicker: ""
    body: |
      **Quintero**

      "Citizens,

      Since our last newsletter, we in MIE and ONI tried to satisfy your urge of exploration and spec-ops related content and attempted to refine the planning process by adding a piece of light but engaging RP & stories to all our recent events.

      The constantly great participation and interest from you all is truly appreciated and we want to thank everyone for their patience in case the server gods and Carrack glitches occasionally haunt our get-togethers.

      Over the last months, we are gladly looking back on a couple of fun event memories with you all - for example from:

      Operation Whisper Point, where we “escorted” an ASD scientist out of Farro IV data center,,

      Operation Thunderbird, where we successfully killed the Apex Valakkar and were in turn killed by SC cheaters,,

      Operation Ghostlight, where we explored the dangers and fascinating immersion of the Onyx Facilities,,

      Operation Skyward Path, where we put a small carrack fleet to the test and enjoyed the longest distance travelled in a USC event till date (13.33 AU – from PT to Pyro IV and back!),

      We are particularly excited to see many new great citizens, in MIE and other ministries, stepping up to create their own MIE-themed events and content – special shout out to RidgeSix and Bar aka Barrus here, but also to newcomers like EtowTheSaltyCat who bring a breath of fresh air into our USC and SC lore!

      Looking ahead, we cannot express how thrilled we are by the thought of venturing out with all of you into Nyx so very soon!

      We are sure it will be an astonishing quarter for all of us explorers and operatives, and you can count on us to throw more Carrack-glitches at you, if you dare to join us

      **Fly safe**

      Quintero & Jichael “Sora” Mackson
