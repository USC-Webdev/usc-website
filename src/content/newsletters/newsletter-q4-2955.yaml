  - heading: Welcome New Citizens!
    kicker: ""
    body: |
      THE USC IS PROUD TO WELCOME THE FOLLOWING NEW CITIZENS TO THE UNITED SPACE CONFEDERATION!

      Dinodel is from Turkey and runs a BMW repair and tuning shop with a friend.

      Did a 6 month deployment to Syria as a mechanized infantry private back in 2023.

      His favorite color is blue, so naturally the USC is a good fit! :)

      Rising Phoenix has studied English for most of his life.

      He has an academic and professional interest in creative writing, storytelling and literature and have a small side job of providing editor services and coaching for aspiring writers.

      He volunteers a lot, 17 years and counting with the Red Cross for one, and I enjoy video games to a very deep degree, even if I end up playing them from a more immersive perspective than a gameplay one.

      Wesmeister lives in the UK. and enjoys many games from MOBAS, Strategy, MMOs, FPS single player and multiplayer.

      He first brought star citizen in 2017 and loved it but felt it needed more aspects and activities, so discovered the USC.

      He does shift work, 12 hour days and nights, because his work is scheduled weeks in advance, planning and notice of any events should be easy.

      Feel free to invite Wesmeister to your next group activity!

      Incus is excited to be a member of the USC and looks forward to helping the org achieve its collective goals!!

      Kapokwu learned about the USC via a long conversation with ChatGPT.

      The Recruitment Team believes this achievement is a World First!

      Narnok work as a Digitalization Consultant, and I has a great passion for the field of UXR (user experience research). Besides this, he likes to exercise his creativity through painting warhammer figures and playing TTRPGs.

      Married for 4 years, has a cat named Leia (Yes princes Leia), and enjoys running.

      Obsidian Knight works as a mechanic and really enjoys it despite the stressful working environment. In his free time he enjoys hunting, fishing, and of course videogames.

      Deewwwyy has a background in finance and data science. He loves Sci-fi and am naturally drawn towards Star Citizen. Currently has a lot of free time to play and fell back in love with the game. Additionally Dewwwyy has a strong interest in Sci-fi beyond star citizen.

      Wyldwunn is artist and a designer, and started his first company while in college. Always a console kid, it wasn't until a few years ago he built his first computer. And slowly started getting into computer gaming.

      "So this is why my wife would tell me that I should make friends. So that what I'm doing [joining the USC]. I like playing different games and becoming different people having these wild adventures going to different lands planets, and moons. Maybe dodging laser fire or a truck that flipping over after as you narrowly escape. I live for the next adventure, where will we go what will we find? That is me, you heard a rumor about some loot! Let's go! That is me! A brother in arms is down or captured, I'm the first to cock that gun and say "Why are we still here?"

      But in the end I'm just me, and lonely adventurer, combat soldier, pilot, recon, and tactician and hopefully your friend.

      Hosokawa (aka Jedrus) joined the USC ready to branch out to group play. In real life he is a stay at home dad of 2, army infantry vet (combat deployed), widower, and big time nerd.

      Laura (aka Larafedil) is from Hungary, and has always been a huge fan of all things science fiction, fantasy and horror. Also since her first commodore 64 computer, has been gaming and possibly will continue that hobby as much as her free time allows.

      Electro describe himself as an entrepreneur, UK based, is 34 years old, and a dad of 2. Used to be in Karmakut's milsim unit in Arma 3. Trained once a week, operations once a month.

      "Too serious and time intensive in the end - I have a family and I couldn't make gaming my life - it's my hobby!"

      Dusty (aka MrDust79 is from the UK and has gamed for many many years, across the full spectrum of games, everything from the original text based adventures on my BBC Acorn, right up to Star Citizen, to table top both mundane and TTRPG.

      He plays for the release from the usual grind of worklife. Gaming is his source for relaxation and enjoyment when i do get time.
