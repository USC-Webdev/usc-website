  - heading: Profiles In Courage
    kicker: ""
    body: |
      _Notable Acts Of Bravery, Contribution And Integrity_

      **Justin Time**

      Justin is a relatively new member of the USC. He and Gargotron has made great videos and USC events for all members to enjoy!

      **Etow The Salty Cat**

      Etow is a relatively new member of the USC and has made a splash with his creation of The Citizen Compass, a newspaper tabloid that will help feature USC lore and tie in with the rich backstory of Star Citizen.

      **Bar**

      Bar is new to the USC, and has jumped right in with his contributions of group gameplay content creation.

      Thank you Bar, and we look forward to your next awesome event!
