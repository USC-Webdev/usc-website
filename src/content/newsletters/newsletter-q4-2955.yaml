      A link to the Citizen Compass will be added to the USC website menu as well.

      - On the heels of an awesome Citizen Con, we are happy to post the relatively brief overview of the USC's 1st annual Confederation Con.

      Thank you all for the wonderful contributions you've made to the USC this past year. Your efforts are helping the USC align nicely with the development of SC's gameplay and your leadership team is excited about the direction we as a collective group are headed.

      Special Thanks to: @Justin-Time (UTC+2) and @Gargotron (UTC +2) for filming the Con Con and editing this video for the enjoyment of those of you unable to attend in person.

      - Member Created Events

      Quarter 3 has seen a wonderful increase in not only group activity, but group gameplay creation.

      This is one of the foundational objectives of the USC leadership, and it is very redeeming to see the strategic plan bearing fruit. We thank all of you for your contributions to making this our Star Citizen place!

      Keep them coming!!

      [Watch on YouTube](https://www.youtube.com/watch?v=rUCq0nzC67A)
