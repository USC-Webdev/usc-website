      Zan (Interim)

      Hello to all you traders, haulers and collectors of aUEC out there,

      Supported by the Ministry of Interstellar Commerce, you've probably been knocking out more hauling contracts than ever before. The revisited Argo Raft and Regen Crisis events have given us a lot of opportunities to get behind the stick and move tonnes of goods. But besides that the player market for top tier ship components and rare resources has been booming.

      This has me looking forward to how we can carve out a piece of that market as the USC and become a reliable supplier of some of these goods. Until Org tools come into the game, our amazing members like Ehriqhck are using their tech magic skills to support us with tools like [E.I.M.S](https://interstellarcommerce.app/public/). or our internal trading hub. And we can't forget about our external trade partners over at [UEXCORP](https://uexcorp.space/), who are opening up true Interstellar Commerce.

      Keep on trucking and earning,

      Dr. Daesang Zaen, Interim minister of MIC
