    body: |
      March:

      "The time has come yet again to revitalize our organization with fresh energy and momentum. We have an interesting election campaign ahead of us Ladies and Gentlemen!

      In this voting campaign we are greeted not by only one candidate but 2! Yes citizens, 2 candidates have stepped forward and will be campaigning for your votes and trust.

      Let me remind you all that the position of Prime Minister, although for a short duration has a very important role within our organization and within Cabinet.

      Besides, providing accountability and transparency, the PM's role serves as a critical way for new ideas to be granted impetus and for new energy to be infused into the cabinet. This in order to keep it fresh and constantly active.

      It is yet again my great honor to announce to you the results if this latest Prime Minister's election!

      Before doing so however I want to thank both candidates for an honest and good campaign. It takes courage and dedication to the org to put yourself out there and run.

      For that I salute you and your steadfast determination to the betterment of this organization that we all hold dear.

      Both candidates had a different approach and platform that gave our citizen's much to think about which respective initiatives they would like to see prioritized.

      Without any further ado, here are the results:

      = With 26.5% Votes, Not counting abstentions, Senator @Kaïn (UTC+2) has shown a strong run with a platform that resonated with many of our citizens. However...

      = With 73.5% of votes, not counting abstentions, Senator @Happpie will be the United Space Confederation's next Prime Minister as of Tomorrow, succeeding @Thomas "mojomonkey" Farrister in this very important role.

      Happpie's terms as PM begins tomorrow and will last for a duration of 6 months, ending on the last day of the year, Dec 31st. 2955(2025)

      I would also like to Thank @Farrister (StreamPC) for his role as peacemaker, impartial observer and arbitrator in the aftermath of the Boost incident. It's comforting to know that we can always benefit from the experience of our retired cabinet members when things get dicey and some extra help might be needed to "keep the ship on course".

      So, Congratulations @Happpie on your nomination to Prime Minister Elect!

      I, Therefore, Calyen Vyshir, Chancellor of the Senate of the United Space Confederation, present to @Cabinet the name of @Happpie as the next Prime Minister of USC.

      May the Stars Always Shine in our Favor!"
