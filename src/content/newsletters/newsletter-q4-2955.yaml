  - heading: A Word From The Minister Of State Affairs
    kicker: ""
    body: |
      **Landscaper**

      Hey Y’all!!

      What a blast Quarter 3 has been! Right off the top: A HUGE "Thank You" to all of you, the membership, for making this quarter a stand out for the USC! Some of the highlights of just a few of the awesome events, contributions and shenanigans during this quarter:

      Confederation Conference:

      While the USC has been around for well over 10 years, we just had our 1st annual conference in game! It was great to see our leadership team all in one place, and made available to meet, greet and answer questions from membership. The feedback from the event's survey was very positive and encouraging and we're already looking forward to next year's Con Con.

      As you may recall, we’ve spent a lot of time over the past years, strategizing and testing our Org’s organizational ideas. With the launching of our annual conference, your leadership team is now ready to operationalize and explain the strategic framework that will support the USC’s collective goals. Basically, Con Con was our official kick off.

      If you haven’t yet, please check out the announcements thread on the USC Discord for the Con Con agenda notes and video, especially if you weren’t able to attend in the game.

      Group Gameplay Creation:

      As mentioned in the newsletter section above, the strategy of allowing members to create group gameplay content is gaining traction. 2955 has seen the most membership generated content creation we’ve seen to date.

      USC Lore and Roleplay:

      While the USC doesn’t impose role play, tying in the USC’s backstory with the storyline that CIG is developing is a great opportunity some of our members are leveraging for the eventual enjoyment of all members.

      Etow the Salty Cat has published a tabloid paper titled: “The Citizen Compass”. He, and a couple of members have expressed interest in helping to update the USCs backstory.

      We’re super excited to see this develop over the coming years as we get closer to the launch of 1.0.

      Mentoring:

      If you’re new to the game, or returning, feel free to check out the Mentoring channel on the USC Discord. Just giving a bit of advice, or taking a player under your wing is most appreciated!

      On Boarding:

      We could use some help with On Boarding. While not as simple as mentoring, any help you could afford is appreciated.

      Special thanks to Dekan for signing up to help. But we certainly need more help plz!

      Ministries:

      Activity in the various ministries have increased substantially. We have many vacant leadership roles, including the Minister of Interstellar Commerce. We have to get these filled so our members' group gameplay activities are properly supported. Reach out to Landscaper today to discuss your interest, I’m happy to help.

      Every contribution, regardless of size, is helping the USC to be the place where we all can enjoy Star Citizen together as a group. We are now seeing good momentum and are so excited to support all that you contribute to your organization.

      **“Let’s Fly.”**

      Keep an eye on our Discord server for announcements, upcoming events, and ways you can contribute to the USC!
