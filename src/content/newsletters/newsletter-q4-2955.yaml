  - heading: "POLICY UPDATE: Prime Minister Backfill"
    kicker: ""
    body: |
      Dear Citizens,

      Due to unknown reasons, it would appear that our Prime Minister has been missing in action since August.

      We do sincerely hope that he is well and hopefully it is nothing to worry about. Our thoughts are with him with wishes that he will return to us soon.

      After several attempts to reach out to him via email and social media DMs with no replies, the leadership has decided on the following course of action.

      In order to keep activity and momentum going as well as to capitalize on the remaining 3 months of the year which historically is one of the org's busiest in terms of activity, we have decided to appoint Happpie's co-candidate as interim Prime Minister to complete the current term till the end of this year.

      Kain's nomination in interim has been unanimously voted by Cabinet and will henceforth take on the responsibilities of Prime Minister on top of his current duties as Director of Resettlement and Immigration.

      Kain shall fulfil the role of PM until the 31st of Dec 2955 (2025).

      On behalf of the Senate and Cabinet we wish Kain good luck with his new duties.

      Best Regards,

      **Caylen Vyshir**

      **Chancellor of the Senate**

      United Space Confederation
