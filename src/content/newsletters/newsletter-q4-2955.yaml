  - heading: Freedom of Navigation Missions (Peacekeeping Missions) JUL 2955 (Closed)
    kicker: ""
    body: |
      The astute among you might recognize a similar topic some time back in July 2951 in which we resolved to begin the foundations of a Standard Operating Procedure for planning so called "peacekeeping" Missions.

      Missions that we will expand to also mean freedom of navigation missions.

      I would like to quote the beginning statement of that past topic as I find it quite inspirational... (recognizing the irony of reflecting on my own words from a few years back...) So it goes:

      "Of greatest endeavors, it is the ones that bring shape and manifest the values of a nation that are remembered and which forms it's character.

      To ourselves we hold the USC's creed of Equality, Prosperity and Freedom deeply entrenched in our minds and in everything that we do, how we treat each other and how we operate.

      So this month, we start this discussion with this question: "Isn't it time that others also know what we stand for?

      **This topic was discussed here: ⁠senate-voting⁠**

      Where we discussed if these missions should be done if at all less we expose ourselves too much to PVP groups before being ready....

      The results of the past vote was to develop our internal procedures. I felt it might be a good time to re-visit the topic but with a more broad set of questions.

      Since then much of our internal workings have been put in place and in light of recent PVP groups interfering with our activities and the willingness to build our PVP skills, It was thought perhaps a good idea to engage in "controlled" PVP where we go out looking for it in more "Bite sized" manageable sessions.

      The goals of the mission would be to patrol specific areas in stanton and/or Pyro (perhaps regularly) and assist citizens of the verse when needed. Target those whom appear as enemies, with crime stats and that perform obvious acts of greifing. In essence, keep the area pleasurable and safe for everyone and by doing so building a reputation of being good Samaritans. We might even attract potential new members this way as well.

      An overwhelming majority at 92.86% accept that the assets of criminals and Griefers are rightfully redistributable to the crews that helped put an end to the activities of said criminals as compensation and reward.

      7.14% Did not indicate specifically where the reward should come from but simply that compensation is implied for risks taken and expenses.

      These are the results this month.

      Do be advised that I will be taking a summer holiday and will be away from my PCs for the next 3 weeks. It is uncertain if I will be able to publish a topic this month.
