  - heading: Featured Events From 3Q2955
    kicker: ""
    body: |
      A FEW IN-GAME & OUT OF GAME EVENTS OUR MEMBERS CREATED AND PARTICIPATED IN THIS PAST QUARTER

      **Mining Monday**

      **Hosted by Justin Time**

      "Join this weekly event to mine and collect gems, protect the area during operations, and haul the fruits of your labor back to base. "

      **Mackson's Mile of Mayhem**

      **Hosted by Jicheal Mackson**

      "Are you tired of the USC constantly imposing operations where you get lost on an Idris, or explode because you quantum jump into one another?

      Are your exhausted by joining your team mates onto that drake ship you really don't like but are just to shy to admit?

      Then grab a partner and sign up for your chance to leave this all behind for a night and let the smell of sweet chaos soothe your nerves."

      We're looking forward to the next one!

      **Hunt the Polaris Mission**

      Hosted by Maxwell.

      "Bring your favourite ship! Whether that's the biggest, the shiniest, or the one you like to fly the most. After CitizenCon, we'll gather as big a group as we can in Stanton, before heading over to Pyro for a short tour together. Lots of opportunity to get some nice screenshots as we parade our fleet.

      No set spawn point for this one, other than "Stanton", we'll co-ordinate the meet up on the day. Everybody is welcome - in fact, the more the merrier!"

      Good times! Join us next year. :)

      Exploration!

      Hosted by Jicheal Mackson.

      "Citizens, with a recent consolidation of security forces and mercenaries to Stanton, reports about increased activity in Pyro have been recorded.

      Therefore, the operation is tasked to evaluate the safety of one of our Pyro Listening Posts located near “Fallow Field, Pyro IV”.

      Fallow Field, being the closest node in our Intelligence Network to the NYX-system, is outmost critical to our overall Naval Intelligence."

      Look out for the next scheduled Exploration event coming soon!

      **Parade the Fleet**

      **Hosted by Farristar**

      "Get-together immediately following CitizenCon Direct.

      Bring your favourite ship! Whether that's the biggest, the shiniest, or the one you like to fly the most. After CitizenCon, we'll gather as big a group as we can in Stanton, before heading over to Pyro for a short tour together.

      Lots of opportunity to get some nice screenshots as we parade our fleet. "

      It was super fun Mojo, thanks! :)

      **Operation Starforge**

      **Hosted by Bar & Jicheal Mackson**

      "To all USC citizens and operatives,

      Our intelligence network has received a sudden spike in reports about imminent attacks to both Stanton and Pyro orchestrated by the group called Frontier Fighter (aka Slicers).

      This terrorist organisation is currently under the Leadership of Amelia Boyd - who has been declared a priority target for USC forces.

      Given the severity level of the threat assessment, we call all USC personnel to prepare to join OPERATION STARFORGE.

      Operation STARFORGE will be a multi-phase / multi-week operation to investigate, contain and eradicate the Frontier Fighter threat.

      Each week, new objectives will be released from the USC Mission Command and emergency funds will be distributed as rewards to citizens, who support the effort.

      The weekly objectives will be made available, once new information has been uncovered and the ongoing objectives are completed.

      All mission objectives, including deliverables and rewards will be tracked under ⁠mission-task-orders.

      **More information will be made available soon**

      **Please stay tuned and await further comms"**

      So Cool. Max had to use is favorite 'Woman Melting' gif!

      **Fractured Frontiers - Phase 1**

      Hosted by Maxwell.

      **"Lets field test the newly released Anvil Paladin**

      (PVP Unlikely)

      Objective:

      Paladin shakedown cruise, Gilly’s Scenario #7,

      Fractured Frontiers Phase 1 Contracts[and/or],

      Yormandi Fight,

      What do we need?

      Paladins,

      Wear your favorite FPS gear but carry only what you’re ok losing in your armor storage"

      Be sure to join Phase 2!

      PSA: Now that we've completed our refresh updates to the USC Discord, no more testing pings! Please revisit your notifications settings so you don't miss upcoming events.
