  - heading: Office Fleet Planning
    kicker: ""
    body: |
      **Director Maxwell Stiles**

      Hello everyone!

      While the game hasn’t had much content for large groups lately, we have still come together to have fun! From carrier operations, to combined arms operations.

      And each time we get together we complete our objectives with great success. I am grateful to have so many amazing people to play a game with that we’re all so passionate for.

      Most recently we invaded an onyx facility with a 20 person strong group and annihilated the Yormandi electric noodle and its companion, that was so much fun.

      We also recently deployed a squadron of mostly fully crewed Paladins. Those things are a beast!

      I am looking forward to the content that has been promised to us at citizencon direct, where we will need to coordinate large combined arms forces to get objectives done in what they called “Tactical Strike Groups”.

      We have a lot to look forward to in 2026 with the upcoming NYX system and all that it has to offer. I see a lot of space combat events in our future!

      Let’s continue being awesome!
