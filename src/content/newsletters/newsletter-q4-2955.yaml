  - heading: Direct or Covert Investigations into Private UEE Enterprises SEPT 2955 (Closed)
    kicker: ""
    body: |
      The drive to achieve and prosper takes many forms and to achieve the pinnacle of success and prosperity, private enterprise have at times embarked on activities that skirt the limits of morality. Under the obfuscations of legal protections afforded by the UEE, activities that would be considered serious crimes under USC law, go undiscovered and unpunished.

      For instance the deeply troubling business practices employed by Hurston Dynamics has been a topic of interest to the Senate in the past. It's Employment practices that equating to indentured servitude, cut throat business tactics and utmost neglect of natural habitats and ecosystems have earned HD the right to be closely investigated by ONI. Although none of this official mind you. (See here: ⁠senate-voting⁠ )

      In recent times, An other organization seems to be worthy of our attention. In an attempt to address the regen crisis, the UEE has greatly relaxed restrictions on Scientific research. This deregulation has permitted Associated Science Development (ASD), amongst other organization, to undertake morally questionable research...

      Thus the question before you Senators is whether we should recognize that some Organizations under the umbrella of the UEE should be under investigation by the USC more directly or should these investigations be kept covert if at all. All this taking into consideration our current delicate diplomatic relations with the UEE.

      Enquiring minds are feeling the thirst for the truth! And... Should the truth be requiring of it... then there shall also be Justice! Please find below the results of September's Senate Polls.

      To Question 1 : Should we openly investigate UEE Private enterprises if the Senate have sufficient evidence pointing to illegal activities under USC law.

      Our Citizens have voted 71.4% to keep our investigations covert and outside of public scrutiny. Our delicate and political situation with the UEE requires it yet we will not let our fragile nation state bow to the pressures and turn away from the very principles that makes the USC the USC. We shall uncover the truth regardless of what dangers and dark shadows we must delve into.

      28.5% Of our citizens have mentioned that such investigations should take place in public enquiries, confronting these accused organizations openly. A nod to the integrity and honor our people hold. It is to be highlighted that combined with the result above, 100% of our citizens are of the opinion that investigations are required and we will not turn a blind eye to what is happening.

      To Question 2: Which of the following UEE Enterprises be added/be kept in our scope of investigations. (Regardless if covert or public).

      A strong push at 40% and 35% weight instructs ONI to prioritize Associated Science Development (ASD) and Hurston Dynamics in that order.

      Other organizations were submitted for investigations however for the sake of keeping our limited resources focused on the main targets, we shall leave it at that... Although not enough to tilt the scales, there are some talk of possible statistical anomalies in the results brought about by the MES's Information Systems... Indeed we will need to review and see if indeed some of the outlying results are from valid vote ballots.

      Thank you all to those whom have participated.

      I wish you all a great day.
