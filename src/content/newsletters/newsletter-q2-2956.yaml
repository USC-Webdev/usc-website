  - heading: Minister of Interstellar Commerce Confirmation Vote. APRIL 2956
    kicker: ""
    body: |
      As most of you may know, several key positions in our cabinet (our executive branch of government) remains vacant. It may take some time to find the right candidates to fill these roles given the necessary trust and seniority needed but today, however, I am here to announce to you that someone has stepped up for the Role of Minister of Interstellar Commerce

      Our current sitting Prime minister, @MaxwellStiles (UTC-5) , has passed a Cabinet vote for his nomination and thus I am here to present his confirmation vote to the Senate.

      Kindly permit me at this time to inform you of how the proceedings will unfold.

      The vote will be Anonymous and will require a quorum of at least 30 Votes in order to be valid. A vote of at least 75% Approving is required to pass (Not counting abstentions)

      You will have the choices as follows:

      **1) Approve**

      **2) Disapprove**

      **3) Abstain**

      Voting to Abstain does not count for or against but does count towards quorum.

      The polls will open in one week's time (7 days) on April 20th 2956 around 1PM UTC and will close 2 weeks later (14days) on May 4th (May the fourth be with you).

      I would like to remind everyone that a Minister position's confirmation vote is a pivotal one for the organization. May you base your votes on not only the acumen of the candidate but also what you feel is best for the Org.

      Should Maxwell Stiles be voted in as Minister of MIC, He will no longer hold the title of Prime Minister and will begin his tenure as the Minister of Interstellar Commerce thus only have one vote in Cabinet.

      Seeing there be only 2 months left to the Prime Ministerial Term, the seat will remain vacant till the term is over on June 30th.

      Results:

      Without beating around the bush, please permit me to announce that we officially now have a minister of Interstellar Commerce!

      With an approval rate of 91.6% (not counting Abstentions) Kindly join me in congratulating @MaxwellStiles (UTC-5) on his new role.

      His countless contributions in the areas of event planning as well as mission coordination has earned him a well deserved reputation as a person that can successfully focus our members to action.

      We look forward to seeing MIC grow into it's own under his leadership and take it's full place as central hub of activity within the USC.

      I wish you all a great day and stay tuned here in about one week for this month's Senate Topic.

      Best Regards,

      Caylen
    gallery:
      - image: ../../assets/images/newsletters/newsletter-q2-2956/sections/17/gallery/0/image.jpg
        alt: Image 1 from “Minister of Interstellar Commerce Confirmation Vote. APRIL 2956”, Newsletter Q2 2956
        caption: ""
        credit: ""
  - heading: United Space Confederation Treasury Custodians MAY 2956
    kicker: ""
    body: |
      In the past few months you may have noted the leaps and strides that our brilliant engineering minds from the Ministry of Engineering and Support have made in the fields of manufacturing and fabrication. The USC has shown yet again it's ability to adapt as well as be on the cutting edge of Science and Technology. A special shout out to Director RidgeSix and the Office of Industrial Engineering as well as all of our enthusiast engineering crafters and Manufacturers who's progress has been extraordinary!

      As we bask in this shared success we must take a step back and contemplate where else to improve our processes to that we can capitalize on this momentum. Please permit me to voice that Manufacturing and Crafting stands not at the beginning nor the end of a broader process but at it's core and middle.

      To cut to the chase, Crafting requires a steady stream of Input materials and once the output items/equipment are crafted and produced, they must be stored, inventoried and kept in a place where they can be readily distributed, sold or otherwise consumed by the people that require them. The gathering, stockpiling of raw resources, crafting and storing of the end products are currently for the most part done by the same people... yet, there might be some people that are only truly interested in part of this process. The Mining of raw resources for instance, or perhaps the hauling of end produce to sell on the open Market. We should be looking for ways so that these disparate activities becomes part of a formal communal process.

      The idea here is not a new one, and indeed we do have in our org structure the establishment of a Confederation Store House. The keen of you might see where this discussion leads. let us turn our attention now to the Ministry of Interstellar Commerce's Treasury who's is its responsibility to store, assign and distribute the USC's stock piles of Monies, Raw resources, Equipment and Assets.

      As our crafters and manufactures take a victory lap, we have not been given the tools necessary to take this activity to the next level. To have a place where individual Miners, gatherers and salvagers can deposit their surplus raw materials, that can then be handed and consumed by our Manufacturers to produce goods that can then also find their way to the Confederation Treasury to be allocated when and to whom it is most needed. Thus freeing this responsibility from the crafters/Manufacturers (if desired).

      I hope that I have succeeded to explain the merits of setting up our Confederation treasury, Assuming I did so, we are faced the obvious problem that we do not have a system in place (i.e. an in game system) to keep and warehouse our organizational Assets. Seeing that crafting is now fast becoming a key activity, we must see if we can put in place the treasury with what we have.

      Thus here is bluntly the question:

      Question: Would you approve that a Key Custodian Person (or Persons) be designated to hold org assets for the purpose of stockpiling raw resources meant for crafting, selling or redistributing as well as storing surplus Equipment for selling, reprovisioning, or redistributing for the purpose of equipping our citizens for official organization activities?

      NOTE: In principle we will try to observer the following points:

      When our miners, gatherers, and salvagers have surplus materials they would like to donate to the org, it would go to Custodians with one of two store houses.

      a.) If the material is useful for crafting with favorable quality, it would go to Custodian(s) within MES, to be managed and utilized for the sole purpose of crafting/manufacturing items to fulfill individual member crafting orders or to build an Org supply of useful items (components, weapons, etc.).

      b.) If the material is not useful for crafting but could be for trading and/or selling, it would go to Custodian(s) within MIC, to be managed and utilized for the purpose of building USC wealth and operations.,

      Once crafters within MES have utilized donated org supplies to manufacture items intended for Org use, but not specifically to fulfill an individual order, MES will transfer these assets to MIC Custodian(s) to manage and distribute.
