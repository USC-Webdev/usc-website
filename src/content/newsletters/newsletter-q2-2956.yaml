    body: |
      **Director Ogi**

      I feel as if I'm almost obligated to start my update with the Obi-Wan "Hello there". I apologize in advance for the Wall of Text, but hey, it’s my introduction to you all as a purple.

      For those of you who don't know me, I am Ogi_the_Great. I am a long-time citizen in the USC, having joined sometime in 2014. I have recently stepped up to become the head of our Office of Diplomatic Support (but I will be trying to think of a cool name both for myself, and my office).

      For those of you who know me, you may be surprised by my decision to do this. I will be the first to admit my many flaws, including being blunt and sometimes oblivious to subtlety. If that is the case, why did I step into this position? Continue on, dear reader, and I will let you know!

      The main inciting event came from a failure of our organization’s diplomatic policies and leadership tasking. An event that happened in February where I was part of an operation ended in a very dissatisfying manner. Frankly, we were griefed, and the reason why we were griefed is because we were effectively infiltrated by an organization that we had no business dealing with in the first place. That is the failure of policy, and several members of our org that I was close to left because of that failure. The failure of leadership tasking is that we have not had a primary diplomat for something close to a decade now; I am a firm believer that you can only ask someone to do their best with what they have to offer, and having one of our leadership team wear the diplomatic hat (which is almost entirely unaligned with every other leadership role) while juggling life and their stated org responsibilities is, my eyes, unreasonable. That made me start to think about if I wanted to take charge of our diplomatic affairs, and here is my reasoning for why I ultimately chose to do so:

      First, I am not entirely bad at talking with people, and generally enjoy it. Especially when it comes to things people are passionate about. I firmly believe that familiarity does not breed contempt, it breeds affection. I would like to serve as an envoy to other orgs and play alongside their members, and I want them to think “Hey, Ogi is a cool dude, the USC is full of cool people too.” I would like to be able to extend that to joint operations, both planned and ad-hoc, with other orgs, but that is a long-term plan.

      Second, my primary mode of enjoying Star Citizen is through collaborative pursuits, but I have a significant amount of education on the use of force throughout history (if you’ve seen the “Brace yourself, Ogi is about to rant about military history and theory” meme on our server, that’s why). I view warfare with other orgs as a last resort, but sometimes it is necessary. I would much rather do cool, fun things with other orgs that make us both money and resources, but if we must let slip the dogs of war, I would prefer to do so with allies on our flanks made strong by our collaboration.

      Third, remember that we are a government, albeit one in exile, and the chief instruments of national power can be abbreviated by DIME: Diplomatic, Intelligence, Military, Economic.

      Role Description:

      - Coordinate with ONI to produce something like the “CIA World Factbook” for Star Citizen, with a biannual review of old entries.
      - Recommend organizations and alliances to the Cabinet to be reached out to for closer relations.
      - Recommend small family groups and single crews to reach out to bring under the USC umbrella.
      - Maintain a presence in any groups you are assigned to as the official USC Envoy.
