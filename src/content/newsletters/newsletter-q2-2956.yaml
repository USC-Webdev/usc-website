  - heading: Unification Day USC
    kicker: ""
    body: |
      The Sol Earth date of August 1st 2792 marks the day when ~~Eagle~~ Hawk industries reorganized as the United Space Confederation. Unequivocally joining the uprising against the UEE and Declaring its independence in the aftermath of the Garron II Massacre. This day marks the beginning of our journey as a Confederation. A collaboration of peoples with a single purpose, to make a future more representative and of a true likeness of humanity. Guided by principles of Equality, Prosperity and Freedom for all.

      This day is typically a holiday and is celebrated with family and friends. Citizens usually take the opportunity to invite colleagues, superiors or otherwise unrelated individuals to more casual festivities where experiences, stories and laughs can be shared as equals with the opportunity to strengthen bonds of friendship that would otherwise be difficult due societal restrictions.

      This day is to be considered our foundation day as an Organization. In the real world, our Org began on Aug 1st 2012. On the heels of the original Kickstarter... yes we are that aged folks! we were there at the beginning. :)
