  - heading: A Word From The Minister Of State Affairs
    kicker: ""
    body: |
      **Landscaper**

      Hey Hey!

      Well, 4.8 is a pretty rough patch am I right?! "Thank You" all for helping each other out and participating in group gameplay even when the game does it's best to challenge us!

      **Main Topic**

      Maxwell was appointed to the Minister of Interstellar Commerce role. His contributions are having an immediate impact, and we look forward to his content as the gameplay develops. Thank you Maxwell.

      Group Gameplay Creation:

      Group gameplay content continues to gain traction. With various hotfixes and 4.9 on the horizon 2956 looks promising with crafting, salvaging and fleet rebalance, with CIG supported org tool on the horizon .

      USC Lore and Roleplay:

      While the USC doesn’t impose role play, tying in the USC’s backstory with the storyline that CIG is developing is a great opportunity some of our members are leveraging for the eventual enjoyment of all members.

      Etow the Salty Cat has volunteered to update the USC Handbook. He delivered the final version and I look forward to placing a help wanted ad for the help of a graphics art talented member soon!

      Mentoring:

      If you’re new to the game, or returning, feel free to check out the Mentoring channel on the USC Discord. Just giving a bit of advice, or taking a player under your wing is most appreciated!

      On Boarding:

      We could use some help with On-Boarding. While not as simple as mentoring, any help you could afford is appreciated.

      Ministries:

      We still have many vacant leadership roles. We have to get these filled so our members' group gameplay activities are properly supported. Reach out to Landscaper today to discuss your interest, I’m happy to help. We’re super excited to see these roles develop as we get closer to the launch of 1.0.

      Every contribution, regardless of size, is helping the USC to be the place where we all can enjoy Star Citizen together as a group. We are now seeing good momentum and are so excited to support all that you contribute to your organization.

      **“Let’s Fly.”**

      Role Description:

      The Consul of Peace is responsible for the stability and metagaming security of the USC. They also have primary oversight of most of the out-of-game support activities like recruitment, diplomacy, Org social sites, and the media team.

      - Retain ownership of the organization and any critical assets. Safeguard access to critical infrastructure like the website, social media accounts, and an in-game org owned assets like the “guild bank” or USC owned ships if that mechanic materializes.
      - Provide leadership, oversight, and a vision for the Recruitment Team, Diplomacy Team, and Media Team (CMN).
      - Maintain an awareness of all USC affiliated documentation, sites, content repositories, etc and ensure that they are managed in a way that allows for seamless and thorough handover when leadership positions change. Confirm the handoff for any changes in the leadership position.

      Keep an eye on our Discord server for announcements, upcoming events, and ways you can contribute to the USC!
