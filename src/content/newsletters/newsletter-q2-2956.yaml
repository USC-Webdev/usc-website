  - heading: Group Gameplay Content
    kicker: ""
    body: |
      Special spotlight on some of our members that have created some phenomenal group gameplay content for all of us to enjoy! Thank you, hours of fun and gigabytes of video & images created.

      - Operation Black Horizon: Story-Themed Event

      A special story-themed event was hosted and organised by our very own Rotorgeist. The story centred around a missing MIE ship, the Black Horizon, which had disappeared while on a secret mission.

      Event attendees had to determine the location of the lost ship before setting out to recover it and its valuable cargo. Along the way, the group encountered several obstacles, but in the end, they successfully found the ship and retrieved its cargo.

      This was the first instalment of many more story events to come, and we certainly look forward to seeing what comes next.

      - Rayari Rep Events

      A special spotlight goes to our member WormingMood, who organised several events to help other members increase their reputation with Rayari. These events helped members get closer to acquiring the valuable blueprints locked behind higher-reputation Rayari missions.

      Thanks to these efforts, many members were able to raise their Rayari reputation and unlock new blueprints.

      - Crafting Parties

      RidgeSix organised crafting parties to allow all Citizens to share their blueprints and resources while working together to craft larger and more advanced components, armour, and weapons.

      Many people have already acquired blueprints, but not everyone has access to the same ones. By working together, members can combine their knowledge and resources to craft more effectively. Valuable resources can be scarce, but by sharing them, we can achieve much more as a community.

      - Daymar Mile of Mayhem – Large Multi-Org Event

      Thanks to increased diplomatic outreach, the USC organised and participated in a large cross-organisational racing event for the first time in its history. Four organisations took part: the United Space Confederation, the Cosmic Coalition, the G.W.E Gang, and the Elysian Alliance. Altogether, 11 teams came to the starting line.

      It was a fantastic event filled with fun, competition, and community spirit. In the end, three USC teams claimed all three top positions, taking home a variety of fun and special prizes.
