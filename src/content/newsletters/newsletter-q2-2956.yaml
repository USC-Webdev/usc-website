  - heading: Profiles In Courage
    kicker: ""
    body: |
      _Notable Acts Of Bravery, Contribution And Integrity_

      **Dinodel**

      Volunteered to help support our group gameplay creation efforts.

      Dinodel volunteered to join the on-boarding team and hit the ground running during the build-up to Alpha 4.8, which not only brought us Drake Defense Con, but also saw the launch of Tactical Strike Groups and the USC being featured on the RSI Orgs page. With the increase in applications, having an extra pair of eyeballs is greatly appreciated.

      Thank you Dinodel!

      **Rotorgeist**

      Supported our group gameplay creation efforts.

      Operation Black Horizon – designed and hosted by Rotorgeist - led citizens through a little Exploration tour through Pyro and did breathe some life into Survey-Gameplay.

      Thank you Rotorgeist!

      **Patholo**

      Group gameplay creation efforts.

      Patholo has been truly dedicated when it comes to helping build the USC blueprint pool, and worked closely with RidgeSix storing donated ores during 4.7. He and RidgeSix are both basing out of MIC-L5 for the USC crafting stores and operations.

      Thank you Patholo!
