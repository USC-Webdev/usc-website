    body: |
      **Director Dekan**

      First and foremost, my heartfelt gratitude goes out to my predecessor Kain for the years of work he put into the USC on-boarding program. He built a rock solid foundation and provided the tools that we will continue to use well into the future. I would also like to thank the Cabinet for entrusting me with this honestly kind of intimidating responsibility. But, as I've already said, Kain put a lot of work into getting this up and running and the team is growing, so I have full confidence that we will continue to improve as we move forward.

      With regard to the work being done, thanks to the continued improvement of the Persistent Universe and, in no small part, to our resident YouTubers Farrister and RidgeSix, recruiting has increased rather dramatically since I initially joined the team last summer. At the time of this writing, we have processed 78 applications to date for 2956, which is over double the 34 applications processed by this time last year! Additionally, 36 new citizens have joined our ranks this year!

      The addition of Wendigo and Gravitas to the team has been instrumental in handling this greater workload. Dinodel has also recently volunteered and is quickly being brought up to speed. That said, with the increased number of applicants, we are not quite at full strength yet. Ideally, we would like to increase the team by at least two more members to help distribute the burden. To be considered, you need to be active in both Discord and in the PU and be willing to engage with new members. Tenure as a citizen, while still a consideration, is secondary to level of engagement. If you are interested in being on the front lines of helping our community grow, please reach out to either Landscaper or myself.

      Clear skies, fly safe (or not, depending on your preference), and I will see you in the 'verse!

      Role Description:

      - Create a top-tier recruitment thread for the RSI Spectrum forums.
      - Keep this thread regularly active so it remains on the first page.
      - Create a selection of top-tier recruitment posts for rotating in the RSI recruitment chat lobby.
      - Create one or more high-quality signatures for USC members to use.
      - Maintain an active presence in the “Becoming a Citizen” chat lobby
      - Maintain an active presence in the General forum, with a USC signature.
      - Process new member applications, and ensure they are appropriately tagged in Discord and Spectrum.
