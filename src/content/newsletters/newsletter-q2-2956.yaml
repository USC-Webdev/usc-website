  - heading: From The Minister Of Security - MSS
    kicker: ""
    body: |
      **Twilly Frost**

      **Ministry of Security Services**

      Greetings from the Ministry of Security Services!

      It's been an odd quarter where combat is concerned, as CIG has turned their focus to crafting. Suddenly mining and hauling are popular, dogs are lying down with cats, it's raining upwards and all of my socks returned from the dryer.

      Max left us to pursue a life of...whatever MIC does. Something to do with training cats to salsa dance.

      Fear not! There is plenty of combat related activity in the near future. We'll be returning to Hathor for that sweet, sweet carinite.

      We'll be setting up an event to run down the Vaughn missions for the Killshot blueprint.

      Tactical strike group play is upon us, a quasi-combined arms event that will require a bit of planning and execution. Mister Stiles will be returning as if he never left to organize that event, as well as others, I'm sure. His first love is cats, closely followed by salsa dancing, but fleet operations will always have a place in his heart as a distant third.

      Lots of changes to ship armor. Weapon damage. It's constantly changing, and will continue to change as CIG sorts out their vision for combat in the PU. At the MSS we're just along for the ride, chasing the meta and shamelessly ambushing you at choke points.

      With the upcoming wipe the rush will be on to earn credits, gather materials, and craft craft craft. The MSS will be front and center building rep, earning credits, earning blueprints, and protecting our comrades as they gather, mine, and haul.

      Gonna be interesting! And full of bugs! Let's gooooooooooooo!

      From the Foxhole,

      **Twilly Frost**

      **Minister, MSS**

      ad astra in proelium
