sections:
  - heading: A Word From The Chancellor
    kicker: ""
    body: |
      Good Day Citizens,

      A strong start of the year on the legislative side as we've cemented and clarified several ambiguous elements of the constitution, We've formed a non-aggression pact with the People's Alliance of Nyx and we are now defining what scope of activities that our government should spent more of it's limited resources on (or expand upon). As we all know, much as the environment of the vers we live in, the United Space Confederation is also constantly in a state of evolution. Every day we are growing together and we are truly, one step at a time, making this nation of ours stronger and truer to our values.

      I would like to take this opportunity to mention that the Senate is "your" forum for change or discourse. Often the Legislation and topic brought to the floor are initiated by Cabinet or the Chancellor (from discussions in private or inspired from conversations and experiences had in the vers' with fellow citizens.) But Indeed any of you are empowered to bring a topic forward to be debated and voted upon.

      Should you have any proposal or piece of potential legislation that you would like to debate, I invite you to discuss it openly in ⁠usc-official or alternatively as a private message to myself and let us see how we can move the initiative forward. Should it be relevant, feasible and executable (or at the very least entertaining) You might be the proud author of your own piece of legislation that passes a vote in Senate. Therefore, leaving your very own mark on the USC for the success of all.

      May the stars always shine in our favor,

      **For Equality, Prosperity and Freedom**

      Sincerely,

      **Caylen Vyshir**

      **Chancellor of the Senate**

      **For Equality, Prosperity, and Freedom**

      **Caylen Vyshir**

      **Chancellor of the Senate**

      United Space Confederation
