  - heading: Department of Industrial Engineering
    kicker: ""
    body: |
      **Director Ridge Six**

      Hello, fellow citizens.

      Operations have been very busy for the Office of Industrial Engineering as crafting has finally become a reality. A huge amount of effort were put in during 4.7 by several USC Crafters to acquire literally hundreds of blueprints for armor and weapons. USC Miners spent thousands of combined hours searching Stanton, Pyro, and Nyx for high-quality ores of various types to contribute to crafting. Overall, these operations were wildly successful! Dozens of armor pieces and weapons were crafted for members of the USC. Then the wipe occurred.

      Now that 4.8 is here and we (fortunately) kept the blueprints we earned during 4.7, we have shifted our efforts to acquiring the new blueprints introduced with this patch. This includes many for ship components, salvage scraping modules, mining lasers, ship weapons, and refuel nozzles. Several of these are behind significant reputation walls, so much effort is being placed on grinding back reputation after the wipe. We are already enjoying much success with this, and I want to make a quick shoutout to Patholo, who dedicated many hours to earning Master rank with Covalex to earn several Military Grade A quantum drive blueprints already. The acquisition of blueprints will continue throughout 4.8 and involves completing missions across many areas of the 'verse, including salvage, mining, cargo hauling, refueling, ship combat, ground combat, and even Tactical Strike Groups.

      Mining efforts are also underway within MES to obtain high-quality ores for crafting. We had a decent stockpile of ores immediately prior to the wipe, and we will be building that back as soon as we can. Understandably following a near-full wipe, progress in gathering refined ores has been slower. Group mining events will occur from time to time, and all are welcome to participate. Because of the refinery bonuses, it was decided that MIC-L5 Station is the home of USC crafting and MES storehouses during the 4.8 era. If miners have a surplus of refined ores that are useful for crafting (greater than 500 quality), and they would like to donate the ore to the USC for crafting, please reach out to me and we can make arrangements for transfer into the MIC-L5 storehouse.

      Multiple events dedicated to crafting were held during the 4.7 era, and I intend to hold such events fairly regularly. These will occur at MIC-L5 once we have build up a storehouse of materials. However, special orders were also fulfilled many times outside of these events during 4.7, and I also intend to continue that practice. Plans are underway to develop a way for USC members to submit special orders, and details of how to do that will be shared in the near future. In the meantime, special orders can be communicated directly to me, either in the MES Channel or as a direct message. USC crafters will do our best to fulfill those orders in a timely manner once materials are secured.

      Here's to the continued success of MES operations related to Industrial Engineering. Cheers!

      **RidgeSix**

      **Director of Industrial Engineering**

      Role Description:

      - Oversee the generation of mining and salvage missions.
      - Track participation in the mission types listed above.
      - Provide advice and support for citizens. considering placing claims on real estate, and track USC citizen-owned areas.
      - Oversee & ensure generation of base building missions and support.
      - Advise the USC on the path to being ready to engage in base building and establishing a true USC territorial foothold.
      - Oversees the activities that provides the USC with crafted and/or improved vehicles, components & equipment.
