  - heading: A Word From The Minister Of Commerce
    kicker: ""
    body: |
      **Maxwell**

      Hello everyone, an update from MIC.

      Thanks to the introduction of ship hangar services, work has begun on testing the logistics of repair, refueling and rearming small craft onboard larger craft such as the Polaris and Idris. This will help engagements in systems such as Nyx go smoother as fighters will no longer have to take long detours after every mission or two to get ready for the next engagement as help will be in the field alongside them.

      Behind the scenes work is in progress on setting up some racing events, with some racing initiatives being worked on by some members of our community behind the scenes, some of which may already be revealed by the time you see this newsletter.

      The USC Central Bank remains very healthy thanks to the insane oversupply of aUEC in the verse, if you need credits, feel free to ping me in MIC-general.

      Unfortunately, due to the oversupply of aUEC in the verse there is little incentive for commodity trading missions so those are mostly on hold until we get a wipe and have a need to get rich again.

      That is all for now. May prosperity find us all!

      The Minister of Commerce responsibilities are to:

      - Monitor USC in-game organizational finances, revenues and expenses
      - Provide a budget recommendation to the Cabinet each quarter, with allocations for each Ministry and the Navy for expenditures.
      - Oversee the USC Central Bank (USCCB)
      - Oversee the generation of Trade Convoy and Commodity Trading Missions.
      - Oversee the transport and shipping of essential USC supplies and equipment.
      - Oversee Touring and racing missions.
      - Manage Ship / Vehicle Replacement Program (SVRP)
