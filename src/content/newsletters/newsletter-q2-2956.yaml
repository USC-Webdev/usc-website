  - heading: General USC Activity Survey MARCH 2956
    kicker: ""
    body: |
      March:

      This month we are doing things a bit differently as we look forward to a fresh patch dropping, we would like to take this chance to poll our citizen's general interests on what kind of activities keeps up their interests. This may inspire our event planners or perhaps give a fresh light on some past activities that were fruitful and engaging. A group such as ourselves thrives on activity thus polls like this are important to take note of what invigorates our citizens in SC.

      In the question below we will offer a list of past events that were done in the past, please select your favorite(s) top 3 (Multiple votes will be possible).

      Question: From the list below, which activity(ies) do you enjoy the most? (Please pick one, two or three but not more to keep the statistics relevant.)

      **1) Casual Fleet Meetups**

      **2) Group Mining/Salvaging Events**

      3) Large events, "focused", related to in game missions (i.e. Hathor),

      4) Large events, "casual", related to in game events (alliance aid missions)

      5) Ad hoc groups formed with pings (@ Flight)

      6) Organized "Focused" Racing Events such as participating the the Daymar Rally

      **7) PVP Focused, Org Vs Org Planed events**

      **8) PVP Focused, Adhoc Bounty hunting**

      9) "Chained", Story driven/narrated RP events.

      10) Other, (the add voting option will be active)

      Results:

      Thanks to all whom have contributed to this latest topic and helped us gain some new insights into what our citizens enjoy doing with us. The main take away, If you may permit me to cut right to the chase, is that in fact the USC appears to be quite successful in providing a wide and appealing array of compelling activities that cater to many different citizen's interests.

      Of note the top three activities were:

      1) Large events， "focused"， related to in game missions (i.e. Hathor) with 27.85% of votes.

      2) Large events， "casual"， related to in game events (alliance aid missions) with 16.46%

      3) Group Mining/Salvaging Events with 13.9% of votes.

      To be fair however the results were very spread out at it was nice to see interest is all proposed activities.

      May these results serve to reinforce the currently popular event types and also help point to those which might need a bit more assistance to make them compelling.

      I wish you all a great day and which you best regards,

      **Caylen**

      May the stars always shine in our favor.
