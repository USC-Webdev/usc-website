  - heading: From The Minister Of Exploration
    kicker: ""
    body: |
      **Quintero**

      Fellow citizens,

      Q1 was the time of crafting and blueprint hunting for many of you, and we are glad to have seen such a great spirit of cross ministry collaboration and plenty MIE members going out and about to explore the verse again for old and new mission types.

      We want to highlight a few initiatives from Q1 and give a special shoutout to one of our own MIE operatives, who hosted his first event in the USC.

      Operation Black Horizon – designed and hosted by Rotorgeist - led citizens through a little Exploration tour through Pyro and did breathe some life into Survey-Gameplay.

      We are already looking forward to more Roleplay focused events from Rotor and other citizens.

      In addition, during Q1, USC Spec Ops operatives eliminated a series of threats in multiple Onyx facilities to equip ONI with critical crafting intel for state-of-the-art Stealth armour.

      One if not the highlight for us this Quarter was the MIE & MSS collaboration in the structured USC Fleet Maneuvre to test the Navy’s preparedness for the upcoming Tactical Strike Group gameplay. Deployment, coordination and comms procedures were tested and are considered ready for larger scale engagements.

      With 4.8 in deployment, MIE is already looking forward to turning our Carrack and 890 exploration vessels into even more competent and capable operation hubs, with proper refuel and rearm for smaller exploration fleets and events.

      **Fly safe everyone**

      Quintero & Jichael
