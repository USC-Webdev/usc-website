overviewHeading: Citizen Compass Overview
overview: >
  The Citizen Compass is a established independent news media organization based
  in the United Space Confederation, founded by EtowTheSaltyCat (Character name
  William Ernst) in 2955 in Orison, Crusader. With its headquarters now moved
  to  Nyx PSS Delta.  It´s stated goal to provide a broad news coverage for the
  citizens and residents of the United Space Confederation and of the UEE,
  providing information and details on the latest operations, events and
  happenings of the USC and the broader UEE. The Citizen Compass is commited to
  share the stories of everyday Citizens in their daily highs and lows, while
  also holding accountable the leaders of the USC and upholding a high
  journalistic standard when researching issues, events, debates and even
  scandals. We believe that a working community needs functioning news coverage
  and active, impartial journalism, as that is integral for the healthy
  wellbeing of any state or organization. Every state has four pillars:
  Legislature, Executive, Judiciary and Media. The Compass proudly stands as a
  representative of the fourth pillar.


  This encompasses Star Citizen Roleplay, Lore crafting & discussions but also
  just reports and news insights on things going on in the verse. We hope you
  enjoy our site, as we continue to grow it with many new ideas, features and
  formats on the way.
