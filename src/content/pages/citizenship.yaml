intro: >
  Are you interested in United Space Confederation Citizenship? Please
  familiarize yourself with our [Vision](/our-vision) and [Citizen
  Policies](/policies) to see if we fit your needs.
rulesHeading: Citizenship
rules: >
  To meet our criteria and be eligible for USC citizenship, potential citizens
  must be able to communicate in English and have a verified RSI account. Once
  you successfully apply satisfactorily, you may be extended a trial period for
  a membership visa, and the USC welcomes you to 'date' us for 90 days. We ask
  that you show the USC as your main org on the RSI site during the trial
  period. Full-fledged citizens are not allowed to be members of other organs,
  except for small friend & family types. No matter how you identify yourself or
  how others perceive you, the USC welcomes citizens of all types, including –
  but not limited to – people of varied ages, cultures, ethnicities, genders,
  gender identities, sexual orientation, language, race, and geographical
  location, as long as you interact positively and constructively with our
  community. This means that deep meta-gaming, rumor-spreading, and baiting are
  unacceptable. We aim to have a drama-free environment where people of all
  kinds can interact and have fun with each other.


  Those who have extended USC citizenship can interact on our social platforms,
  contribute their thoughts and ideas to the USC, and participate in all of our
  events (in and out of the game). We ask that you follow our policies outlined
  on [this page](https://usc-website-nine.vercel.app/policies).


  To stay an active USC Citizen once Star Citizen launches, we expect all our
  Citizens to contribute meaningfully. This does not mean we enforce playtime
  rules or requirements; Citizens are free to play when they can. Your real life
  comes first. Instead, we expect USC Citizens to use their play time, whenever
  or however long it might be, in a meaningful way that benefits themselves and
  the United Space Confederation.


  ### You must abide by these rules to remain a USC Citizen


  - Respect all people,

  - Remain civil during social interaction,

  - Absolutely no racism, homophobia, sexism, or other prejudices,

  - No drama. Contact USC Leadership for help with dispute resolution,

  - Maintain exclusive membership with the USC unless you fit the exception
  found in the Dual Citizenship policy,

  - Do not engage in piracy, extortion (trolling), and/or slavery gameplay while
  playing Star Citizen under the USC flag and

  - Respect the alliances, treaties, trade contracts, and agreements between the
  USC and other entities.
