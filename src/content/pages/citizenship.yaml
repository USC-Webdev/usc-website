intro: |
  Are you interested in United Space Confederation Citizenship? Please familiarize yourself with our [Vision](/our-vision) and [Citizen Policies](/policies) to see if we fit your needs.
rulesHeading: You must abide by these rules to remain a USC Citizen
rules: |
  - Respect all people,
  - Remain civil during social interaction,
  - Absolutely no racism, homophobia, sexism, or other prejudices,
  - No drama. Contact USC Leadership for help with dispute resolution,
  - Maintain exclusive membership with the USC unless you fit the exception found in the Dual Citizenship policy,
  - Do not engage in piracy, extortion (trolling), and/or slavery gameplay while playing Star Citizen under the USC flag and
  - Respect the alliances, treaties, trade contracts, and agreements between the USC and other entities.
